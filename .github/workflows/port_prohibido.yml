name: Port Prohibido - Opera GX 100% Nativo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-windows-assets:
    name: "Fase 1 - Extraccion de Assets Windows"
    runs-on: ubuntu-latest
    outputs:
      gx_version: ${{ steps.extract.outputs.gx_version }}
    steps:
      - name: "Instalar herramientas de extraccion"
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full innoextract nsis
      
      - name: "Descargar el especimen"
        run: |
          echo "Descargando instalador oficial de Opera GX..."
          curl -L -o OperaGXSetup.exe "https://net.geo.opera.com/opera_gx/stable/windows"
          ls -lh OperaGXSetup.exe
      
      - name: "Extraer con innoextract (metodo principal)"
        id: extract
        run: |
          mkdir -p gx-assets extracted-resources
          
          # Metodo 1: innoextract (para instaladores Inno Setup)
          if innoextract OperaGXSetup.exe -d gx-assets/ 2>/dev/null; then
            echo "Extraccion con innoexit exitosa"
          else
            echo "innoextract fallo, intentando con 7z..."
            # Metodo 2: 7z con extraccion recursiva
            7z x OperaGXSetup.exe -ogx-assets/ -y || true
            7z x "gx-assets/*.7z" -ogx-assets/ -y 2>/dev/null || true
          fi
          
          # Buscar el directorio de la version
          VERSION_DIR=$(find gx-assets/ -type d -name "[0-9]*" | head -n 1)
          if [ -z "$VERSION_DIR" ]; then
            VERSION_DIR=$(ls -d gx-assets/*/ 2>/dev/null | head -n 1)
          fi
          
          echo "Directorio de version encontrado: $VERSION_DIR"
          echo "gx_version=$(basename $VERSION_DIR 2>/dev/null || echo 'unknown')" >> $GITHUB_OUTPUT
          
          # Extraer recursos criticos
          if [ -n "$VERSION_DIR" ] && [ -d "$VERSION_DIR" ]; then
            echo "Extrayendo recursos de $VERSION_DIR..."
            find "$VERSION_DIR" -name "*.pak" -exec cp {} extracted-resources/ \; 2>/dev/null || true
            find "$VERSION_DIR" -name "*.json" -exec cp {} extracted-resources/ \; 2>/dev/null || true
            find "$VERSION_DIR" \( -name "*.png" -o -name "*.ico" -o -name "*.wav" -o -name "*.dll" \) -exec cp {} extracted-resources/ \; 2>/dev/null || true
          else
            echo "ADVERTENCIA: No se encontro directorio de version, extrayendo todo..."
            find gx-assets/ -type f \( -name "*.pak" -o -name "*.json" -o -name "*.png" -o -name "*.ico" \) -exec cp {} extracted-resources/ \; 2>/dev/null || true
          fi
          
          # Verificar que hay archivos
          FILE_COUNT=$(find extracted-resources/ -type f | wc -l)
          echo "Archivos extraidos: $FILE_COUNT"
          
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No se extrajeron archivos. Listando contenido de gx-assets:"
            find gx-assets/ -type f | head -n 20
            exit 1
          fi
      
      - name: "Listar contenido extraido (debug)"
        run: |
          echo "Contenido de extracted-resources:"
          ls -lh extracted-resources/ | head -n 20
          echo ""
          echo "Total de archivos:"
          find extracted-resources/ -type f | wc -l
      
      - name: "Preservar artefactos"
        uses: actions/upload-artifact@v4
        with:
          name: gx-assets-prohibido
          path: extracted-resources/
          if-no-files-found: error

  compile-chromium-native:
    name: "Fase 2 - La Forja Nativa Linux"
    needs: extract-windows-assets
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: "Preparar el terreno con Swap"
        run: |
          echo "Activando 8GB de Swap..."
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: "Recuperar assets extraidos"
        uses: actions/download-artifact@v4
        with:
          name: gx-assets-prohibido
          path: gx-assets/

      - name: "Verificar assets descargados"
        run: |
          echo "Verificando assets descargados..."
          ls -lh gx-assets/ | head -n 20
          FILE_COUNT=$(find gx-assets/ -type f | wc -l)
          echo "Total de archivos: $FILE_COUNT"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No hay assets descargados"
            exit 1
          fi

      - name: "Instalar herramientas de compilacion"
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 curl xz-utils jq \
            build-essential pkg-config libgtk-3-dev libx11-dev \
            libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev

      - name: "Clonar el motor Chromium"
        run: |
          echo "Descargando codigo fuente de Chromium..."
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH="$PWD/depot_tools:$PATH"
          echo "PATH=$PATH" >> $GITHUB_ENV
          
          mkdir chromium && cd chromium
          fetch --no-history chromium
          cd src
          git checkout main

      - name: "Inyectar el Disfraz GX"
        run: |
          cd chromium/src
          echo "Inyectando el ADN de Opera GX..."
          
          # Copiar recursos extraidos
          cp ../../gx-assets/*.png chrome/app/theme/default_100_percent/chromium/ 2>/dev/null || true
          cp ../../gx-assets/*.ico chrome/app/theme/ 2>/dev/null || true
          
          # Modificar cadenas de texto
          sed -i 's/Chromium/Opera GX/g' chrome/app/chromium_strings.grd 2>/dev/null || true
          sed -i 's/Google Chrome/Opera GX/g' chrome/app/generated_resources.grd 2>/dev/null || true

      - name: "Configurar compilacion nativa"
        run: |
          cd chromium/src
          echo "Configurando compilacion para Linux x64..."
          gn gen out/Default --args='
            is_debug=false
            is_official_build=true
            symbol_level=0
            use_thin_lto=false
            use_sysroot=false
            treat_warnings_as_errors=false
            enable_nacl=false
            enable_hangout_services_extension=false
            enable_widevine=true
            target_os="linux"
            target_cpu="x64"
            use_allocator="none"
          '

      - name: "Compilar el nucleo"
        run: |
          cd chromium/src
          echo "Iniciando compilacion (4 jobs paralelos)..."
          ninja -C out/Default chrome -j 4

      - name: "Inyectar libffmpeg de Ld-Hagen"
        run: |
          echo "Inyectando libffmpeg.so de Ld-Hagen..."
          FFMPEG_URL=$(curl -s https://api.github.com/repos/Ld-Hagen/fix-opera-linux-ffmpeg-widevine/releases/latest \
            | jq -r '.assets[] | select(.name | match(".*-linux-x64\\.zip$")) | .browser_download_url' | head -n 1)
          wget -O ffmpeg.zip "$FFMPEG_URL"
          unzip -o ffmpeg.zip -d ffmpeg-temp/
          
          TARGET_FFMPEG=$(find chromium/src/out/Default -name "libffmpeg.so" | head -n 1)
          if [ -n "$TARGET_FFMPEG" ]; then
            cp ffmpeg-temp/libffmpeg.so "$TARGET_FFMPEG"
            echo "Inyeccion completada."
          else
            echo "ADVERTENCIA: No se encontro libffmpeg.so en el build"
          fi

      - name: "Empaquetar AppImage"
        run: |
          mkdir -p OperaGX-Native.AppDir/usr/bin
          
          cat << 'EOF' > OperaGX-Native.AppDir/opera-gx.desktop
          [Desktop Entry]
          Name=Opera GX
          Comment=Port Prohibido - 100% Native Linux
          Exec=AppRun
          Icon=opera-gx
          Type=Application
          Categories=Network;WebBrowser;
          EOF
          
          wget -q -O OperaGX-Native.AppDir/opera-gx.png "https://upload.wikimedia.org/wikipedia/commons/8/89/Opera_GX_Icon.png" || \
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > OperaGX-Native.AppDir/opera-gx.png
          
          cat << 'EOF' > OperaGX-Native.AppDir/AppRun
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          echo "Iniciando Port Prohibido (100% Nativo)..."
          exec "$HERE/usr/bin/chrome" --no-sandbox --disable-gpu-sandbox "$@"
          EOF
          chmod +x OperaGX-Native.AppDir/AppRun
          
          cp chromium/src/out/Default/chrome OperaGX-Native.AppDir/usr/bin/
          cp -r chromium/src/out/Default/locales OperaGX-Native.AppDir/usr/bin/ 2>/dev/null || true
          cp -r chromium/src/out/Default/resources OperaGX-Native.AppDir/usr/bin/ 2>/dev/null || true

      - name: "Sellado del AppImage"
        run: |
          export ARCH=x86_64
          LATEST_TOOL=$(curl -s https://api.github.com/repos/AppImage/appimagetool/releases/latest \
            | jq -r '.assets[] | select(.name | endswith("-x86_64.AppImage")) | .browser_download_url' | head -n 1)
          wget -O appimagetool "$LATEST_TOOL"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run OperaGX-Native.AppDir OperaGX-PortProhibido-x86_64.AppImage

      - name: "Publicar Release"
        uses: softprops/action-gh-release@v2
        with:
          files: OperaGX-PortProhibido-x86_64.AppImage
          tag_name: "port-prohibido-v1.0"
          name: "Port Prohibido - Opera GX 100% Nativo"
          body: |
            ## Port Prohibido - Opera GX 100% Nativo
            
            Port nativo real construido desde el codigo fuente de Chromium.
            
            ### Caracteristicas:
            1. Motor: Compilado desde Chromium oficial para Linux
            2. Identidad: Recursos extraidos del binario de Windows
            3. Codecs: libffmpeg.so de Ld-Hagen para Twitch/DRM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
