name: Port Prohibido - Opera GX 100% Nativo (Motor Linux + Recursos Windows)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-complete-assets:
    name: "Fase 1 - Extraccion Completa (Linux + Windows)"
    runs-on: ubuntu-latest
    outputs:
      gx_version: ${{ steps.extract.outputs.gx_version }}
    steps:
      - name: "Instalar herramientas de extraccion y Wine"
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg wget curl p7zip-full innoextract wine wine32 xvfb
      
      - name: "Descargar Opera GX Linux (.deb)"
        run: |
          echo "Descargando motor nativo de Linux..."
          curl -L -o opera-gx-linux.deb "https://download3.operacdn.com/pub/opera_gx/stable/linux"
          ls -lh opera-gx-linux.deb
      
      - name: "Descargar stub de Windows"
        run: |
          echo "Descargando stub de Windows para obtener recursos completos..."
          curl -L -o opera-gx-windows-stub.exe "https://net.geo.opera.com/opera_gx/stable/windows"
          ls -lh opera-gx-windows-stub.exe
      
      - name: "Ejecutar stub de Windows con Wine para descargar instalador real"
        run: |
          echo "Ejecutando stub con Wine (esto descargara el instalador real)..."
          xvfb-run -a wine opera-gx-windows-stub.exe /silent /downloadonly /dir=C:\\opera-gx-real || true
          
          # Buscar el instalador real descargado
          sleep 10
          REAL_INSTALLER=$(find ~/.wine/drive_c/opera-gx-real/ -name "*.exe" -o -name "*.7z" | head -n 1)
          
          if [ -z "$REAL_INSTALLER" ]; then
            echo "ADVERTENCIA: No se encontro instalador real, intentando extraccion directa del stub..."
            7z x opera-gx-windows-stub.exe -owin-assets/ -y || true
            REAL_INSTALLER=$(find win-assets/ -name "*.exe" | head -n 1)
          fi
          
          if [ -n "$REAL_INSTALLER" ]; then
            echo "Instalador real encontrado: $REAL_INSTALLER"
            cp "$REAL_INSTALLER" opera-gx-windows-real.exe
          else
            echo "ERROR: No se pudo obtener el instalador real de Windows"
            exit 1
          fi
      
      - name: "Extraer recursos completos de Windows"
        run: |
          mkdir -p win-assets extracted-resources
          
          echo "Extrayendo instalador real de Windows con innoextract..."
          innoextract opera-gx-windows-real.exe -d win-assets/ || {
            echo "innoextract fallo, usando 7z..."
            7z x opera-gx-windows-real.exe -owin-assets/ -y || true
          }
          
          echo "Estructura de Windows extraida:"
          find win-assets/ -type f | head -n 50
      
      - name: "Extraer motor de Linux"
        run: |
          mkdir -p linux-assets
          dpkg-deb -x opera-gx-linux.deb linux-assets/
          
          echo "Estructura de Linux extraida:"
          find linux-assets/ -type f | head -n 30
      
      - name: "Combinar recursos (Linux + Windows)"
        id: extract
        run: |
          # Buscar directorios de version
          WIN_DIR=$(find win-assets/ -type d -name "[0-9]*" | head -n 1)
          LINUX_DIR=$(find linux-assets/ -type d -name "opera-gx" -o -name "opera" | head -n 1)
          
          echo "Directorio Windows: $WIN_DIR"
          echo "Directorio Linux: $LINUX_DIR"
          
          # Extraer version
          VERSION="unknown"
          if [ -n "$LINUX_DIR" ] && [ -f "$LINUX_DIR/product_version" ]; then
            VERSION=$(cat "$LINUX_DIR/product_version")
          fi
          echo "gx_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          
          # PRIORIDAD: Recursos visuales de Windows (splash screens, sonidos, temas)
          if [ -n "$WIN_DIR" ] && [ -d "$WIN_DIR" ]; then
            echo "Extrayendo recursos visuales de Windows..."
            find "$WIN_DIR" \( -name "*.png" -o -name "*.jpg" -o -name "*.wav" -o -name "*.mp3" -o -name "*.pak" \) -exec cp {} extracted-resources/ \; 2>/dev/null || true
          fi
          
          # Complementar con recursos de Linux (binarios nativos, configs)
          if [ -n "$LINUX_DIR" ] && [ -d "$LINUX_DIR" ]; then
            echo "Extrayendo recursos de Linux..."
            find "$LINUX_DIR" \( -name "*.so" -o -name "*.json" -o -name "opera" \) -exec cp {} extracted-resources/ \; 2>/dev/null || true
          fi
          
          # Verificar
          FILE_COUNT=$(find extracted-resources/ -type f | wc -l)
          echo "Archivos extraidos totales: $FILE_COUNT"
          
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No se extrajeron archivos"
            exit 1
          fi
      
      - name: "Listar contenido combinado"
        run: |
          echo "=== Recursos combinados ==="
          ls -lh extracted-resources/ | head -n 40
          echo ""
          echo "Total: $(find extracted-resources/ -type f | wc -l) archivos"
      
      - name: "Preservar artefactos"
        uses: actions/upload-artifact@v4
        with:
          name: gx-assets-prohibido
          path: extracted-resources/
          if-no-files-found: error

  compile-chromium-native:
    name: "Fase 2 - La Forja Nativa Linux"
    needs: extract-complete-assets
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: "Preparar el terreno con Swap"
        run: |
          echo "Activando 8GB de Swap..."
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: "Recuperar assets combinados"
        uses: actions/download-artifact@v4
        with:
          name: gx-assets-prohibido
          path: gx-assets/

      - name: "Verificar assets"
        run: |
          echo "Verificando assets..."
          ls -lh gx-assets/ | head -n 30
          FILE_COUNT=$(find gx-assets/ -type f | wc -l)
          echo "Total: $FILE_COUNT archivos"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No hay assets"
            exit 1
          fi

      - name: "Instalar herramientas de compilacion"
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 curl xz-utils jq \
            build-essential pkg-config libgtk-3-dev libx11-dev \
            libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev

      - name: "Clonar el motor Chromium"
        run: |
          echo "Descargando codigo fuente de Chromium..."
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH="$PWD/depot_tools:$PATH"
          echo "PATH=$PATH" >> $GITHUB_ENV
          
          mkdir chromium && cd chromium
          fetch --no-history chromium
          cd src
          git checkout main

      - name: "Inyectar el Disfraz GX Completo"
        run: |
          cd chromium/src
          echo "Inyectando recursos visuales de Windows + motor Linux..."
          
          # Copiar splash screens, iconos y recursos visuales de Windows
          cp ../../gx-assets/*.png chrome/app/theme/default_100_percent/chromium/ 2>/dev/null || true
          cp ../../gx-assets/*.jpg chrome/app/theme/default_100_percent/chromium/ 2>/dev/null || true
          cp ../../gx-assets/*.ico chrome/app/theme/ 2>/dev/null || true
          
          # Modificar cadenas de texto
          sed -i 's/Chromium/Opera GX/g' chrome/app/chromium_strings.grd 2>/dev/null || true
          sed -i 's/Google Chrome/Opera GX/g' chrome/app/generated_resources.grd 2>/dev/null || true

      - name: "Configurar compilacion nativa"
        run: |
          cd chromium/src
          gn gen out/Default --args='
            is_debug=false
            is_official_build=true
            symbol_level=0
            use_thin_lto=false
            use_sysroot=false
            treat_warnings_as_errors=false
            enable_nacl=false
            enable_hangout_services_extension=false
            enable_widevine=true
            target_os="linux"
            target_cpu="x64"
            use_allocator="none"
          '

      - name: "Compilar el nucleo"
        run: |
          cd chromium/src
          echo "Iniciando compilacion..."
          ninja -C out/Default chrome -j 4

      - name: "Inyectar libffmpeg de Ld-Hagen"
        run: |
          echo "Inyectando libffmpeg.so..."
          FFMPEG_URL=$(curl -s https://api.github.com/repos/Ld-Hagen/fix-opera-linux-ffmpeg-widevine/releases/latest \
            | jq -r '.assets[] | select(.name | match(".*-linux-x64\\.zip$")) | .browser_download_url' | head -n 1)
          wget -O ffmpeg.zip "$FFMPEG_URL"
          unzip -o ffmpeg.zip -d ffmpeg-temp/
          
          TARGET_FFMPEG=$(find chromium/src/out/Default -name "libffmpeg.so" | head -n 1)
          if [ -n "$TARGET_FFMPEG" ]; then
            cp ffmpeg-temp/libffmpeg.so "$TARGET_FFMPEG"
            echo "Inyeccion completada."
          else
            echo "ADVERTENCIA: No se encontro libffmpeg.so"
          fi

      - name: "Empaquetar AppImage"
        run: |
          mkdir -p OperaGX-Native.AppDir/usr/bin
          
          cat << 'EOF' > OperaGX-Native.AppDir/opera-gx.desktop
          [Desktop Entry]
          Name=Opera GX
          Comment=Port Prohibido - Motor Linux + Recursos Windows
          Exec=AppRun
          Icon=opera-gx
          Type=Application
          Categories=Network;WebBrowser;
          EOF
          
          wget -q -O OperaGX-Native.AppDir/opera-gx.png "https://upload.wikimedia.org/wikipedia/commons/8/89/Opera_GX_Icon.png" || \
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > OperaGX-Native.AppDir/opera-gx.png
          
          cat << 'EOF' > OperaGX-Native.AppDir/AppRun
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/chrome" --no-sandbox --disable-gpu-sandbox "$@"
          EOF
          chmod +x OperaGX-Native.AppDir/AppRun
          
          cp chromium/src/out/Default/chrome OperaGX-Native.AppDir/usr/bin/
          cp -r chromium/src/out/Default/locales OperaGX-Native.AppDir/usr/bin/ 2>/dev/null || true
          cp -r chromium/src/out/Default/resources OperaGX-Native.AppDir/usr/bin/ 2>/dev/null || true

      - name: "Sellado del AppImage"
        run: |
          export ARCH=x86_64
          LATEST_TOOL=$(curl -s https://api.github.com/repos/AppImage/appimagetool/releases/latest \
            | jq -r '.assets[] | select(.name | endswith("-x86_64.AppImage")) | .browser_download_url' | head -n 1)
          wget -O appimagetool "$LATEST_TOOL"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run OperaGX-Native.AppDir OperaGX-PortProhibido-x86_64.AppImage

      - name: "Publicar Release"
        uses: softprops/action-gh-release@v2
        with:
          files: OperaGX-PortProhibido-x86_64.AppImage
          tag_name: "port-prohibido-v1.0"
          name: "Port Prohibido - Opera GX 100% Nativo (Completo)"
          body: |
            ## Port Prohibido - Opera GX 100% Nativo
            
            Port nativo real con recursos visuales completos.
            
            ### La Combinacion Prohibida:
            1. **Motor**: Compilado desde Chromium oficial para Linux
            2. **Recursos Visuales**: Splash screens, sonidos y temas extraidos del instalador de Windows
            3. **Codecs**: libffmpeg.so de Ld-Hagen para Twitch/DRM
            
            ### Por que este port es diferente:
            La version oficial de Linux de Opera GX esta incompleta. Este port combina el motor nativo de Linux con los recursos visuales completos de Windows para una experiencia GX 100% autentica.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
