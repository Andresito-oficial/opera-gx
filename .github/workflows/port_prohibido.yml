name: Port Prohibido - Reparación Total con Winget y NVIDIA NIM
on:
  workflow_dispatch:

jobs:
  reverse-engineer-and-port:
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: "Checkout del repositorio"
        uses: actions/checkout@v4

      - name: "Instalar herramientas (Radare2, Python)"
        run: |
          choco install radare2 -y
          pip install openai

      # ==========================================
      # 1. INSTALAR OPERA GX Y BUSCAR ARCHIVOS
      # ==========================================
      - name: "Instalar Opera GX vía Winget y listar archivos"
        shell: pwsh
        run: |
          echo "Instalando Opera GX..."
          winget install --id Opera.OperaGX -e --silent --accept-package-agreements --accept-source-agreements
          Start-Sleep -Seconds 15
          
          $common_paths = @(
            "$env:LOCALAPPDATA\Programs\Opera GX",
            "C:\Program Files\Opera GX",
            "C:\Program Files (x86)\Opera GX"
          )
          
          $install_dir = $null
          foreach ($path in $common_paths) {
            if (Test-Path $path) { $install_dir = $path; break }
          }
          
          if (-not $install_dir) {
            Write-Host "❌ No se encontró la carpeta de instalación."
            exit 1
          }
          echo "Directorio encontrado: $install_dir"

          # Buscamos TODOS los archivos relevantes
          $extensions = @("*.exe", "*.dll", "*.json", "*.ini", "*.xml")
          $files = Get-ChildItem -Path $install_dir -Recurse -Include $extensions | Select-Object -ExpandProperty FullName
          
          $files | Out-File -FilePath files_list.txt -Encoding utf8
          Write-Host "Total de componentes a analizar: $($files.Count)"

      # ==========================================
      # 2. ANALIZAR CON PYTHON + NIM
      # ==========================================
      - name: "Reparar y Portar con NVIDIA NIM"
        shell: bash # Usamos bash para el heredoc de Python
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat << 'EOF' > nim_analyzer.py
          import os
          import time
          from openai import OpenAI, RateLimitError, NotFoundError

          client = OpenAI(
              base_url="https://integrate.api.nvidia.com/v1",
              api_key=os.environ["NVIDIA_API_KEY"]
          )

          with open("files_list.txt", "r", encoding="utf-8") as f:
              files = [line.strip() for line in f if line.strip()]

          report_file = "Reporte_Reparacion_OperaGX.md"
          with open(report_file, "w", encoding="utf-8") as f:
              f.write("# Reporte de Portabilidad y Reparación\n\n")

          for file_path in files:
              file_name = os.path.basename(file_path)
              ext = file_path.split('.')[-1].lower()
              print(f"Analizando: {file_name}...")

              prompt = ""

              if ext in ['exe', 'dll']:
                  # Es un binario
                  strings_file = f"/tmp/{file_name}_strings.txt"
                  exports_file = f"/tmp/{file_name}_exports.txt"
                  
                  # En Windows, las rutas con espacios deben ir entre comillas
                  os.system(f'r2 -q -e scr.color=0 -c "iz" "{file_path}" > "{strings_file}" 2>/dev/null')
                  os.system(f'r2 -q -e scr.color=0 -c "iE" "{file_path}" > "{exports_file}" 2>/dev/null')
                  
                  try:
                      with open(strings_file, "r", errors="ignore") as f:
                          strings_data = f.read()[:3000]
                      with open(exports_file, "r", errors="ignore") as f:
                          exports_data = f.read()[:3000]
                  except FileNotFoundError:
                      strings_data = exports_data = "No data"
                  
                  prompt = f"""
                  Analiza este binario/librería de Windows: "{file_name}".
                  1. Deduce su propósito.
                  2. Identifica funciones exportadas clave (si es DLL) o APIs críticas.
                  3. Propón la estrategia exacta para portarlo a Linux.

                  EXPORTS:
                  {exports_data}

                  STRINGS:
                  {strings_data}
                  """
              else:
                  # Es un archivo de texto (JSON, INI, XML)
                  try:
                      with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                  except Exception:
                      content = "[Archivo binario o ilegible]"
                  
                  if len(content) > 5000:
                      content = content[:5000] + "\n...[TRUNCADO]..."

                  prompt = (
                      'Analiza este archivo de configuración de Windows: "' + file_name + '".\n'
                      '1. Identifica las partes del código que romperán en Linux.\n'
                      '2. Reescribe el CONTENIDO COMPLETO adaptándolo a Linux.\n'
                      '3. Devuelve SOLO el bloque de código reparado.\n\n'
                      'CONTENIDO ORIGINAL:\n```\n' + content + '\n```'
                  )

              payload_model = "nvidia/nemotron-3-super-120b-a12b"
              success = False
              retries = 0

              while not success and retries < 3:
                  try:
                      response = client.chat.completions.create(
                          model=payload_model,
                          messages=[{"role": "user", "content": prompt}],
                          temperature=0.2,
                          max_tokens=2048
                      )
                      result = response.choices[0].message.content
                      
                      with open(report_file, "a", encoding="utf-8") as f:
                          f.write(f"\n\n## Componente: `{file_name}`\n")
                          f.write(f"**Tipo:** {ext.upper()}\n\n")
                          f.write(f"{result}\n")
                      
                      print(f"✅ {file_name} analizado.")
                      success = True
                      
                  except RateLimitError:
                      print("⚠️ Límite de RPM alcanzado. Esperando 15 segundos...")
                      time.sleep(15)
                      retries += 1
                  except NotFoundError:
                      print("Modelo 404. Cambiando a Nemotron Nano...")
                      payload_model = "nvidia/nemotron-3-nano-30b-a3b"
                      retries += 1
                  except Exception as e:
                      print(f"❌ Error con {file_name}: {e}")
                      with open(report_file, "a", encoding="utf-8") as f:
                          f.write(f"\n\n## Componente: `{file_name}`\n[Error: {str(e)}]\n")
                      success = True
                          
              # Pausa de 2 segundos
              time.sleep(2)

          print("✅ Proceso de reparación completado.")
          EOF
          python3 nim_analyzer.py

      - name: "Subir reporte de reparación"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-reparacion-opera-gx
          path: Reporte_Reparacion_OperaGX.md
