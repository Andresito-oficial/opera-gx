name: Port Prohibido - Análisis Windows y Qwen Code

on:
  workflow_dispatch:

jobs:
  reverse-engineer-and-port:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      models: read # Permiso crucial para usar GitHub Models (Qwen)

    steps:
      - name: "Checkout del repositorio"
        uses: actions/checkout@v4

      - name: "Instalar herramientas (Radare2, 7z, Python)"
        run: |
          sudo apt-get update
          sudo apt-get install -y radare2 p7zip-full wget file python3 python3-pip
          pip install openai

      # ==========================================
      # 1. DESCARGAR Y EXTRAER SOLO WINDOWS
      # ==========================================
      - name: "Descargar y extraer Opera GX (Windows)"
        run: |
          echo "Descargando instalador de Windows..."
          wget -O opera_gx_win_installer.exe "https://net.geo.opera.com/opera_gx/stable/windows"
          
          echo "Verificando el tipo de archivo..."
          file opera_gx_win_installer.exe
          
          echo "Extrayendo el instalador con 7z (adiós problemas de untar)..."
          mkdir -p windows-base
          7z x opera_gx_win_installer.exe -o./windows-base/ -y
          
          echo "Buscando el splash screen..."
          SPLASH_EXE=$(find windows-base/ -name "opera_gx_splash.exe" | head -n 1)
          if [ -z "$SPLASH_EXE" ]; then
            echo "No se encontró opera_gx_splash.exe, buscando otro binario principal..."
            SPLASH_EXE=$(find windows-base/ -name "opera.exe" | head -n 1)
          fi
          
          if [ -z "$SPLASH_EXE" ]; then
            echo "❌ Error: No se encontró ningún binario para analizar."
            exit 1
          fi
          
          echo "Archivo seleccionado: $SPLASH_EXE"
          echo "SPLASH_EXE_PATH=$SPLASH_EXE" >> $GITHUB_ENV

      # ==========================================
      # 2. DESCOMPILAR CON RADARE2
      # ==========================================
      - name: "Descompilar binario con Radare2"
        run: |
          echo "Extrayendo strings..."
          r2 -q -e scr.color=0 -c "iz > splash_strings.txt" "${{ env.SPLASH_EXE_PATH }}"
          
          echo "Analizando función main..."
          r2 -q -e scr.color=0 -c "aaa; afl; pdf @ main > splash_main_decompiled.txt" "${{ env.SPLASH_EXE_PATH }}"
          
          echo "Tamaño de los archivos generados:"
          ls -lh splash_strings.txt splash_main_decompiled.txt

      # ==========================================
      # 3. QWEN GENERA EL CÓDIGO (Sin API Key manual)
      # ==========================================
      - name: "Qwen genera los cambios necesarios para el port"
        env:
          # GitHub nos da este token automáticamente, no hace falta configurar nada
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > qwen_analyzer.py
          import os
          from openai import OpenAI

          # Configurar el cliente para usar GitHub Models (Qwen gratis)
          client = OpenAI(
              base_url="https://models.inference.ai.azure.com",
              api_key=os.environ["GITHUB_TOKEN"]
          )

          # Leer los archivos generados por Radare2
          with open("splash_main_decompiled.txt", "r") as f:
              decompiled_code = f.read()[:15000] # Límite de tokens
              
          with open("splash_strings.txt", "r") as f:
              strings_data = f.read()[:8000]

          prompt = f"""
          Actúa como un experto en ingeniería inversa de software y desarrollo en C/C++.
          Tengo el código descompilado de un binario de Windows (opera_gx_splash.exe).
          Quiero portarlo a Linux o crear un parche para evitar depender de las APIs de Windows.

          Aquí tienes los Strings encontrados:
          {strings_data}

          Aquí tienes la función principal descompilada:
          {decompiled_code}

          Por favor:
          1. Analiza la lógica del binario.
          2. Escribe el código en C o C++ necesario para replicar esta funcionalidad nativamente en Linux.
          3. Si ves llamadas a la API de Windows (como CreateWindow, ShellExecute, etc.), escribe sus equivalentes en GTK, Qt o llamadas POSIX.
          4. Explica brevemente qué hace el splash screen basándote en el código.
          """

          print("Enviando datos a Qwen (vía GitHub Models)...")
          try:
              response = client.chat.completions.create(
                  model="qwen2.5-coder-32b-instruct", # Modelo Qwen disponible en GitHub
                  messages=[
                      {"role": "system", "content": "Eres un experto en reversing y portabilidad de software."},
                      {"role": "user", "content": prompt}
                  ],
                  temperature=0.2
              )
              
              with open("qwen_port_strategy.md", "w") as out:
                  out.write(response.choices[0].message.content)
              print("✅ Código y estrategia generados con éxito.")
          except Exception as e:
              print(f"❌ Error contactando con Qwen: {e}")
              with open("qwen_port_strategy.md", "w") as out:
                  out.write(f"# Error\nNo se pudo generar el código. Detalles: {e}")
          EOF
          
          python3 qwen_analyzer.py

      # ==========================================
      # 4. EMPAQUETAR RESULTADOS
      # ==========================================
      - name: "Empaquetar resultados del port"
        run: |
          mkdir -p dist
          cp splash_main_decompiled.txt dist/
          cp splash_strings.txt dist/
          cp qwen_port_strategy.md dist/
          
          tar -czvf dist/Opera-GX-Qwen-Port.tar.gz -C dist/ .
          echo "¡Paquete listo para descargar!"

      - name: "Subir artefacto"
        uses: actions/upload-artifact@v4
        with:
          name: Opera-GX-Port-Completo
          path: dist/Opera-GX-Qwen-Port.tar.gz
