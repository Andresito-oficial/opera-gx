name: Port Prohibido - Opera GX 100% Nativo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-windows-assets:
    name: "Fase 1 - Extraccion de Assets Windows"
    runs-on: ubuntu-latest
    outputs:
      gx_version: ${{ steps.extract.outputs.gx_version }}
      extraction_success: ${{ steps.extract.outputs.success }}
    steps:
      - name: "Descargar el especimen"
        run: |
          echo "Descargando instalador oficial de Opera GX para Windows..."
          curl -L -o OperaGXSetup.exe "https://net.geo.opera.com/opera_gx/stable/windows"
          
          # Verificar que la descarga funcionó
          if [ ! -f OperaGXSetup.exe ] || [ ! -s OperaGXSetup.exe ]; then
            echo "ERROR: La descarga falló o el archivo está vacío"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s OperaGXSetup.exe)
          echo "Archivo descargado: $FILE_SIZE bytes"
          
          # Verificar que sea un ejecutable válido (debe empezar con MZ)
          if ! head -c 2 OperaGXSetup.exe | grep -q "MZ"; then
            echo "ERROR: El archivo descargado no parece ser un ejecutable Windows válido"
            file OperaGXSetup.exe
            exit 1
          fi
          
          echo "Archivo válido detectado"

      - name: "Extraer contenido del instalador"
        run: |
          echo "Extrayendo contenido del instalador SFX..."
          mkdir -p gx-assets
          
          # Intentar extraer con 7z
          if 7z x OperaGXSetup.exe -ogx-assets/ -y; then
            echo "Extracción con 7z exitosa"
          else
            echo "7z falló, intentando con unzip..."
            unzip -o OperaGXSetup.exe -d gx-assets/ || true
          fi
          
          # Listar qué se extrajo
          echo "Contenido extraído:"
          find gx-assets/ -type f | head -n 20
          
          # Contar archivos
          FILE_COUNT=$(find gx-assets/ -type f | wc -l)
          echo "Total de archivos extraídos: $FILE_COUNT"
          
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No se extrajo ningún archivo"
            exit 1
          fi

      - name: "Disecar y extraer recursos clave"
        id: extract
        run: |
          # Encontrar el directorio de la versión
          VERSION_DIR=$(find gx-assets/ -type d -name "[0-9]*" | head -n 1)
          
          if [ -z "$VERSION_DIR" ]; then
            echo "ERROR: No se encontró directorio de versión"
            echo "Listando estructura de gx-assets:"
            find gx-assets/ -maxdepth 3 -type d
            exit 1
          fi
          
          echo "Directorio de versión encontrado: $VERSION_DIR"
          echo "gx_version=$(basename $VERSION_DIR)" >> $GITHUB_OUTPUT
          
          mkdir -p extracted-resources
          
          echo "Extrayendo archivos .pak..."
          find "$VERSION_DIR" -name "*.pak" -exec cp {} extracted-resources/ \; 2>/dev/null || echo "No se encontraron archivos .pak"
          
          echo "Extrayendo archivos .json..."
          find "$VERSION_DIR" -name "*.json" -exec cp {} extracted-resources/ \; 2>/dev/null || echo "No se encontraron archivos .json"
          
          echo "Extrayendo recursos visuales..."
          find "$VERSION_DIR" \( -name "*.png" -o -name "*.ico" -o -name "*.wav" \) -exec cp {} extracted-resources/ \; 2>/dev/null || echo "No se encontraron recursos visuales"
          
          # Verificar que se extrajo algo
          RESOURCE_COUNT=$(find extracted-resources/ -type f | wc -l)
          echo "Total de recursos extraídos: $RESOURCE_COUNT"
          
          if [ "$RESOURCE_COUNT" -gt 0 ]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "Extracción exitosa"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "WARNING: No se extrajeron recursos, pero continuando..."
          fi
          
          echo "Contenido de extracted-resources:"
          ls -la extracted-resources/ | head -n 20

      - name: "Preservar artefactos"
        if: steps.extract.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gx-assets-prohibido
          path: extracted-resources/

  compile-chromium-native:
    name: "Fase 2 - La Forja Nativa Linux"
    needs: extract-windows-assets
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: "Verificar que la Fase 1 fue exitosa"
        run: |
          if [ "${{ needs.extract-windows-assets.outputs.extraction_success }}" != "true" ]; then
            echo "ERROR: La Fase 1 no extrajo recursos correctamente"
            exit 1
          fi
          echo "Fase 1 completada exitosamente"

      - name: "Preparar el terreno con Swap"
        run: |
          echo "Activando 8GB de Swap para evitar OOM..."
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: "Recuperar assets extraidos"
        uses: actions/download-artifact@v4
        with:
          name: gx-assets-prohibido
          path: gx-assets/

      - name: "Instalar herramientas de compilacion"
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 curl xz-utils jq \
            build-essential pkg-config libgtk-3-dev libx11-dev \
            libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev

      - name: "Clonar el motor Chromium"
        run: |
          echo "Descargando codigo fuente oficial de Chromium..."
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH="$PWD/depot_tools:$PATH"
          echo "PATH=$PATH" >> $GITHUB_ENV
          
          mkdir chromium && cd chromium
          fetch --no-history chromium
          cd src
          git checkout main

      - name: "Inyectar el Disfraz GX"
        run: |
          cd chromium/src
          echo "Inyectando el ADN de Opera GX en el motor nativo..."
          
          # Verificar que los assets existen
          if [ ! -d "../../gx-assets" ] || [ -z "$(ls -A ../../gx-assets/)" ]; then
            echo "ERROR: No se encontraron assets de GX"
            exit 1
          fi
          
          echo "Assets disponibles:"
          ls -la ../../gx-assets/ | head -n 20
          
          # Copiar recursos visuales
          cp ../../gx-assets/*.png chrome/app/theme/default_100_percent/chromium/ 2>/dev/null || echo "No se copiaron PNGs"
          cp ../../gx-assets/*.ico chrome/app/theme/ 2>/dev/null || echo "No se copiaron ICOs"
          
          # Modificar cadenas de texto
          if [ -f chrome/app/chromium_strings.grd ]; then
            sed -i 's/Chromium/Opera GX/g' chrome/app/chromium_strings.grd
            echo "Modificado chromium_strings.grd"
          else
            echo "WARNING: No se encontró chromium_strings.grd"
          fi
          
          if [ -f chrome/app/generated_resources.grd ]; then
            sed -i 's/Google Chrome/Opera GX/g' chrome/app/generated_resources.grd
            echo "Modificado generated_resources.grd"
          else
            echo "WARNING: No se encontró generated_resources.grd"
          fi

      - name: "Configurar compilacion nativa"
        run: |
          cd chromium/src
          echo "Configurando parametros de compilacion para Linux x64..."
          gn gen out/Default --args='
            is_debug=false
            is_official_build=true
            symbol_level=0
            use_thin_lto=false
            use_sysroot=false
            treat_warnings_as_errors=false
            enable_nacl=false
            enable_hangout_services_extension=false
            enable_widevine=true
            target_os="linux"
            target_cpu="x64"
            use_allocator="none"
          '

      - name: "Compilar el nucleo"
        run: |
          cd chromium/src
          echo "Iniciando la forja (limitado a 4 jobs para salvar RAM)..."
          ninja -C out/Default chrome -j 4

      - name: "Inyectar libffmpeg de Ld-Hagen"
        run: |
          echo "Inyectando libffmpeg.so nativa de Ld-Hagen..."
          FFMPEG_URL=$(curl -s https://api.github.com/repos/Ld-Hagen/fix-opera-linux-ffmpeg-widevine/releases/latest \
            | jq -r '.assets[] | select(.name | match(".*-linux-x64\\.zip$")) | .browser_download_url' | head -n 1)
          
          if [ -z "$FFMPEG_URL" ] || [ "$FFMPEG_URL" = "null" ]; then
            echo "ERROR: No se pudo obtener la URL de libffmpeg"
            exit 1
          fi
          
          wget -O ffmpeg.zip "$FFMPEG_URL"
          unzip -o ffmpeg.zip -d ffmpeg-temp/
          
          TARGET_FFMPEG=$(find chromium/src/out/Default -name "libffmpeg.so" | head -n 1)
          
          if [ -z "$TARGET_FFMPEG" ]; then
            echo "ERROR: No se encontró libffmpeg.so en el directorio de compilación"
            exit 1
          fi
          
          cp ffmpeg-temp/libffmpeg.so "$TARGET_FFMPEG"
          echo "Inyeccion completada. Codecs nativos listos."

      - name: "Empaquetar AppImage"
        run: |
          mkdir -p OperaGX-Native.AppDir/usr/bin
          
          cat << 'EOF' > OperaGX-Native.AppDir/opera-gx.desktop
          [Desktop Entry]
          Name=Opera GX
          Comment=Port Prohibido - 100% Native Linux
          Exec=AppRun
          Icon=opera-gx
          Type=Application
          Categories=Network;WebBrowser;
          EOF
          
          wget -q -O OperaGX-Native.AppDir/opera-gx.png "https://upload.wikimedia.org/wikipedia/commons/8/89/Opera_GX_Icon.png" || \
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > OperaGX-Native.AppDir/opera-gx.png
          
          cat << 'EOF' > OperaGX-Native.AppDir/AppRun
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          echo "Iniciando Port Prohibido (100% Nativo, CERO Wine/Box64)..."
          exec "$HERE/usr/bin/chrome" --no-sandbox --disable-gpu-sandbox "$@"
          EOF
          chmod +x OperaGX-Native.AppDir/AppRun
          
          cp chromium/src/out/Default/chrome OperaGX-Native.AppDir/usr/bin/
          cp -r chromium/src/out/Default/locales OperaGX-Native.AppDir/usr/bin/ 2>/dev/null || true
          cp -r chromium/src/out/Default/resources OperaGX-Native.AppDir/usr/bin/ 2>/dev/null || true

      - name: "Sellado del AppImage"
        run: |
          export ARCH=x86_64
          LATEST_TOOL=$(curl -s https://api.github.com/repos/AppImage/appimagetool/releases/latest \
            | jq -r '.assets[] | select(.name | endswith("-x86_64.AppImage")) | .browser_download_url' | head -n 1)
          wget -O appimagetool "$LATEST_TOOL"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run OperaGX-Native.AppDir OperaGX-PortProhibido-x86_64.AppImage

      - name: "Publicar Release"
        uses: softprops/action-gh-release@v2
        with:
          files: OperaGX-PortProhibido-x86_64.AppImage
          tag_name: "port-prohibido-v1.0"
          name: "Port Prohibido - Opera GX 100% Nativo para Linux"
          body: |
            ## Port Prohibido - Opera GX 100% Nativo
            
            Este es un port nativo real construido mediante ingenieria de sistemas.
            
            ### La Alquimia:
            1. Motor: Compilado desde cero usando el codigo fuente oficial de Chromium para Linux.
            2. Identidad: Recursos extraidos del binario oficial de Windows.
            3. Codecs: Inyeccion automatica de libffmpeg.so de Ld-Hagen.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
