name: Port Prohibido - Análisis Windows y NVIDIA NIM
on:
  workflow_dispatch:

jobs:
  reverse-engineer-and-port:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: "Checkout del repositorio"
        uses: actions/checkout@v4

      - name: "Instalar dependencias"
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            wget file python3 python3-pip \
            wine64 wine32 xvfb unzip cabextract \
            radare2 p7zip-full
          pip install openai

      - name: "Descargar instalador de Opera GX"
        run: |
          set -euxo pipefail
          mkdir -p work
          cd work
          wget -O opera_gx_installer.exe "https://net.geo.opera.com/opera_gx/stable/windows"
          file opera_gx_installer.exe

      - name: "Instalar Opera GX con Wine"
        run: |
          set -euxo pipefail
          cd work

          export WINEARCH=win64
          export WINEPREFIX="$HOME/.wine"

          # Arranca Wine en un display virtual para que el instalador pueda crear ventanas
          xvfb-run -a wine64 opera_gx_installer.exe || true

          echo "Esperando a que termine la instalación..."
          sleep 25

          echo "Arbol de instalación actual:"
          find "$HOME/.wine/drive_c" -maxdepth 5 -type f 2>/dev/null | sed -n '1,200p' || true

      - name: "Localizar el EXE real de Opera GX"
        run: |
          set -euxo pipefail
          cd work

          echo "Buscando exe de Opera / splash / launcher..."
          mapfile -t EXES < <(find "$HOME/.wine/drive_c" -type f \( -iname "*.exe" -o -iname "*.dll" \) 2>/dev/null | grep -Ei 'opera|splash|launcher|gx' | sort)

          if [ "${#EXES[@]}" -eq 0 ]; then
            echo "No se encontró ningún exe relacionado con Opera GX en el prefix de Wine."
            find "$HOME/.wine/drive_c" -maxdepth 8 -type f 2>/dev/null | sed -n '1,200p'
            exit 1
          fi

          for exe in "${EXES[@]}"; do
            echo "== $exe =="
            file "$exe" || true
          done

          SPLASH_EXE=$(find "$HOME/.wine/drive_c" -type f \( -iname "*opera*.exe" -o -iname "*splash*.exe" -o -iname "*launcher*.exe" -o -iname "*gx*.exe" \) 2>/dev/null | head -n 1)

          if [ -z "$SPLASH_EXE" ]; then
            SPLASH_EXE="${EXES[0]}"
          fi

          echo "Archivo seleccionado: $SPLASH_EXE"
          echo "SPLASH_EXE_PATH=$SPLASH_EXE" >> "$GITHUB_ENV"

      - name: "Descompilar con Radare2"
        run: |
          set -euxo pipefail
          echo "Strings..."
          r2 -q -e scr.color=0 -c "iz > splash_strings.txt" "${{ env.SPLASH_EXE_PATH }}"
          echo "Main..."
          r2 -q -e scr.color=0 -c "aaa; afl; pdf @ main > splash_main_decompiled.txt" "${{ env.SPLASH_EXE_PATH }}"
          ls -lh splash_strings.txt splash_main_decompiled.txt

      - name: "NVIDIA NIM genera los cambios necesarios"
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat << 'EOF' > nim_analyzer.py
          import os
          from openai import OpenAI

          client = OpenAI(
              base_url="https://integrate.api.nvidia.com/v1",
              api_key=os.environ["NVIDIA_API_KEY"]
          )

          with open("splash_main_decompiled.txt", "r", errors="ignore") as f:
              decompiled_code = f.read()[:15000]

          with open("splash_strings.txt", "r", errors="ignore") as f:
              strings_data = f.read()[:8000]

          prompt = f"""
          Actúa como experto en ingeniería inversa y desarrollo en Linux.
          Este es un ejecutable Windows real instalado con Wine.
          Analiza las funciones y strings y propone un port funcional a Linux.

          ### Código de main (descompilado):
          {decompiled_code}

          ### Strings extraídos:
          {strings_data}

          ### Propuesta de port:
          """

          response = client.chat.completions.create(
              model="nvidia/nemotron-3-super-120b-a12b",
              messages=[{"role": "user", "content": prompt}],
              temperature=0.2,
              max_tokens=4096
          )

          print(response.choices[0].message.content)
          EOF

          python3 nim_analyzer.py
