name: Port Prohibido - Reparación Total (Binarios, DLLs y JSONs)
on:
  workflow_dispatch:

jobs:
  reverse-engineer-and-port:
    runs-on: ubuntu-latest
    timeout-minutes: 360 
    permissions:
      contents: read

    steps:
      - name: "Checkout del repositorio"
        uses: actions/checkout@v4

      - name: "Instalar herramientas"
        run: |
          sudo apt-get update
          sudo apt-get install -y radare2 python3 python3-pip
          pip install openai

      - name: "Extraer e identificar TODOS los archivos"
        run: |
          if [ -f "Opera GX.tar" ]; then
            tar -xf "Opera GX.tar"
          else
            echo "❌ No se encontró 'Opera GX.tar'."
            exit 1
          fi
          
          # Buscamos binarios (exe, dll) y textos (json, ini, xml)
          find . -type f \( -name "*.exe" -o -name "*.dll" -o -name "*.json" -o -name "*.ini" -o -name "*.xml" \) ! -name "*.sh" ! -name "*.py" > files_list.txt
          
          echo "Total de componentes a analizar:"
          wc -l files_list.txt

      - name: "Reparar y Portar con NVIDIA NIM"
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat << 'EOF' > nim_analyzer.py
          import os
          import time
          from openai import OpenAI, RateLimitError, NotFoundError

          client = OpenAI(
              base_url="https://integrate.api.nvidia.com/v1",
              api_key=os.environ["NVIDIA_API_KEY"]
          )

          with open("files_list.txt", "r") as f:
              files = [line.strip() for line in f if line.strip()]

          report_file = "Reporte_Reparacion_OperaGX.md"
          with open(report_file, "w", encoding="utf-8") as f:
              f.write("# Reporte de Portabilidad y Reparación\n\n")

          for file_path in files:
              file_name = os.path.basename(file_path)
              ext = file_path.split('.')[-1].lower()
              print(f"Analizando: {file_name}...")

              prompt = ""

              if ext in ['exe', 'dll']:
                  # Es un binario. Extraemos strings y exports (para DLLs)
                  strings_file = f"/tmp/{file_name}_strings.txt"
                  exports_file = f"/tmp/{file_name}_exports.txt"
                  
                  os.system(f"r2 -q -e scr.color=0 -c 'iz' '{file_path}' > {strings_file} 2>/dev/null")
                  os.system(f"r2 -q -e scr.color=0 -c 'iE' '{file_path}' > {exports_file} 2>/dev/null")
                  
                  with open(strings_file, "r", errors="ignore") as f:
                      strings_data = f.read()[:3000]
                  with open(exports_file, "r", errors="ignore") as f:
                      exports_data = f.read()[:3000]
                  
                  prompt = f"""
                  Analiza este binario/librería de Windows: "{file_name}".
                  1. Deduce su propósito.
                  2. Identifica las funciones exportadas clave (si es una DLL) o APIs de sistema críticas.
                  3. Propón la estrategia exacta para portarlo a Linux (ej. reemplazar por librerías nativas, reescribir en Python/C++, o usar Wine).

                  EXPORTS:
                  {exports_data}

                  STRINGS:
                  {strings_data}
                  """
              else:
                  # Es un archivo de texto (JSON, INI, XML). Lo leemos directamente.
                  try:
                      with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                  except Exception:
                      content = "[Archivo binario o ilegible]"
                  
                  if len(content) > 5000:
                      content = content[:5000] + "\n...[TRUNCADO]..."

                  # Usamos concatenación de strings para evitar errores con las llaves {} del JSON
                  prompt = (
                      'Analiza este archivo de configuración/manifiesto de Windows: "' + file_name + '".\n'
                      'Contiene rutas de Windows, variables de entorno o configuraciones específicas.\n'
                      '1. Identifica las partes del código que romperán en Linux (ej. "C:\\Windows", "%APPDATA%").\n'
                      '2. Reescribe el CONTENIDO COMPLETO del archivo adaptándolo a Linux (ej. "/usr/share", "~/.config").\n'
                      '3. Devuelve SOLO el bloque de código reparado.\n\n'
                      'CONTENIDO ORIGINAL:\n```\n' + content + '\n```'
                  )

              payload_model = "nvidia/nemotron-3-super-120b-a12b"
              success = False
              retries = 0

              while not success and retries < 3:
                  try:
                      response = client.chat.completions.create(
                          model=payload_model,
                          messages=[{"role": "user", "content": prompt}],
                          temperature=0.2,
                          max_tokens=2048
                      )
                      result = response.choices[0].message.content
                      
                      with open(report_file, "a", encoding="utf-8") as f:
                          f.write(f"\n\n## Componente: `{file_name}`\n")
                          f.write(f"**Tipo:** {ext.upper()}\n\n")
                          f.write(f"{result}\n")
                      
                      print(f"✅ {file_name} analizado.")
                      success = True
                      
                  except RateLimitError:
                      print("⚠️ Límite de RPM alcanzado. Esperando 15 segundos...")
                      time.sleep(15)
                      retries += 1
                  except NotFoundError:
                      print("Modelo 404. Cambiando a Nemotron Nano...")
                      payload_model = "nvidia/nemotron-3-nano-30b-a3b"
                      retries += 1
                  except Exception as e:
                      print(f"❌ Error con {file_name}: {e}")
                      with open(report_file, "a", encoding="utf-8") as f:
                          f.write(f"\n\n## Componente: `{file_name}`\n[Error: {str(e)}]\n")
                      success = True
                          
              # Respetar el límite de 40 RPM (Pausa de 2 segundos)
              time.sleep(2)

          print("✅ Proceso de reparación completado.")
          EOF
          python3 nim_analyzer.py

      - name: "Subir reporte de reparación"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-reparacion-opera-gx
          path: Reporte_Reparacion_OperaGX.md
