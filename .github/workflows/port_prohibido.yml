name: Port Prohibido - Análisis Completo y NVIDIA NIM
on:
  workflow_dispatch:

jobs:
  reverse-engineer-and-port:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: "Checkout del repositorio"
        uses: actions/checkout@v4

      - name: "Instalar herramientas (Radare2, Python)"
        run: |
          choco install radare2 -y
          pip install openai

      - name: "Instalar Opera GX vía Winget"
        run: |
          winget install --id Opera.OperaGX -e --silent --accept-package-agreements --accept-source-agreements
          Start-Sleep -Seconds 10

      - name: "Localizar binarios y generar lista"
        id: find_exes
        shell: pwsh
        run: |
          $common_paths = @(
            "$env:LOCALAPPDATA\Programs\Opera GX",
            "C:\Program Files\Opera GX",
            "C:\Program Files (x86)\Opera GX"
          )
          
          $install_dir = $null
          foreach ($path in $common_paths) {
            if (Test-Path $path) {
              $install_dir = $path
              break
            }
          }
          if (-not $install_dir) {
            Write-Host "❌ No se encontró la carpeta de instalación."
            exit 1
          }
          Write-Host "Directorio encontrado: $install_dir"
          echo "INSTALL_DIR=$install_dir" >> $env:GITHUB_ENV

          # Listar todos los .exe
          Get-ChildItem -Path $install_dir -Filter "*.exe" -Recurse | Select-Object FullName | Out-File -FilePath exes.txt
          
          Write-Host "Lista de ejecutables generada en exes.txt"
          Get-Content exes.txt

      - name: "Analizar componentes y generar reporte con NVIDIA NIM"
        shell: pwsh
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          $exes = Get-Content exes.txt | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '\.exe$' }
          # Limitamos a los primeros 5 para evitar timeouts
          $limit = 5
          $count = 0

          foreach ($exe in $exes) {
            if ($count -ge $limit) { break }
            $count++
            $fileName = Split-Path $exe -Leaf
            Write-Host "Analizando: $fileName"
            
            # Extraer strings con r2
            r2 -q -e scr.color=0 -c "iz" "$exe" > "$fileName_strings.txt"
            # Descompilar main (si existe)
            r2 -q -e scr.color=0 -c "aaa; s main; pdf" "$exe" > "$fileName_decompiled.txt" 2>$null
            
            $prompt = @"
            Analiza el binario de Windows "$fileName" (parte de Opera GX).
            Basado en el código descompilado y los strings extraídos, proporciona:
            1. Propósito del binario.
            2. Dependencias críticas de Windows (APIs, DLLs).
            3. Plan de portabilidad a Linux (herramientas, librerías sustitutas, pasos).
            
            Strings extraídos:
            $(Get-Content "$fileName_strings.txt" -Raw -ErrorAction SilentlyContinue | Select-Object -First 5000)
            
            Código descompilado (main):
            $(Get-Content "$fileName_decompiled.txt" -Raw -ErrorAction SilentlyContinue | Select-Object -First 15000)
            "@
            
            # Construir el cuerpo de la petición
            $body = @{
              model = "nvidia/nemotron-3-super-120b-a12b"
              messages = @(@{ role = "user"; content = $prompt })
              temperature = 0.2
              max_tokens = 4096
            } | ConvertTo-Json -Depth 10

            try {
              $response = Invoke-RestMethod -Uri "https://integrate.api.nvidia.com/v1/chat/completions" -Method Post -Headers @{ "Authorization" = "Bearer $env:NVIDIA_API_KEY"; "Content-Type" = "application/json" } -Body $body
              $response.choices[0].message.content | Out-File -FilePath "port_report_$fileName.txt"
              Write-Host "Reporte generado para $fileName"
            } catch {
              Write-Host "Error con $fileName : $_"
              # Fallback a otro modelo si es 404
              if ($_.Exception.Response.StatusCode -eq 'NotFound') {
                  Write-Host "Intentando con nemotron-3-nano-30b-a3b..."
                  $body.model = "nvidia/nemotron-3-nano-30b-a3b"
                  try {
                      $response = Invoke-RestMethod -Uri "https://integrate.api.nvidia.com/v1/chat/completions" -Method Post -Headers @{ "Authorization" = "Bearer $env:NVIDIA_API_KEY"; "Content-Type" = "application/json" } -Body $body
                      $response.choices[0].message.content | Out-File -FilePath "port_report_$fileName.txt"
                      Write-Host "Reporte generado para $fileName (fallback)"
                  } catch {
                      Write-Host "Fallback también falló para $fileName"
                  }
              }
            }
          }

      - name: "Subir reportes como artefacto"
        uses: actions/upload-artifact@v4
        with:
          name: porting-reports
          path: port_report_*.txt
