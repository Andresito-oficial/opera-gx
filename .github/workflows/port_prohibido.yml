name: Port Prohibido - Fusión Nativa (Release Asset + Linux Base)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fusion-patch:
    name: "Fusión de Assets y Generación de Patch"
    runs-on: ubuntu-latest
    steps:
      - name: "Descargar assets de Windows desde Release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Descargando archivo desde los Releases (con autenticación)..."
          mkdir -p windows-base
          
          # Usar la CLI de GitHub para descargar el asset. 
          # Busca cualquier archivo .tar.xz en el release "v1.0.0-base"
          gh release download v1.0.0-base --repo Andresito-oficial/opera-gx --pattern "*.tar.xz" --dir .
          
          # Verificar qué se descargó realmente
          DOWNLOADED_FILE=$(ls *.tar.xz 2>/dev/null | head -n 1)
          
          if [ -z "$DOWNLOADED_FILE" ]; then
            echo "❌ ERROR: No se encontró ningún archivo .tar.xz en el release."
            echo "Archivos presentes en la carpeta:"
            ls -la
            exit 1
          fi
          
          echo "✅ Archivo descargado correctamente: $DOWNLOADED_FILE"
          echo "Verificando tipo de archivo:"
          file "$DOWNLOADED_FILE"
          
          echo "Extrayendo contenido..."
          tar -xJf "$DOWNLOADED_FILE" -C windows-base/
          
          echo "📊 Estructura de Windows extraída:"
          echo "Total de archivos: $(find windows-base/ -type f | wc -l)"
          find windows-base/ -type f | head -n 20

      - name: "Descargar y extraer base nativa de Linux"
        run: |
          echo "Descargando .deb oficial de Linux..."
          
          # Usamos la URL de redirección oficial y un User-Agent para evitar bloqueos del CDN
          curl -L -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               -o opera-gx-linux.deb "https://www.opera.com/download/gx"
          
          echo "Verificando archivo descargado..."
          file opera-gx-linux.deb
          
          if ! file opera-gx-linux.deb | grep -q "Debian"; then
            echo "ERROR: El .deb descargado no es válido. Es probable que el CDN haya bloqueado la descarga."
            echo "Contenido del archivo (primeras líneas):"
            head -n 10 opera-gx-linux.deb
            exit 1
          fi
          
          echo "✅ .deb válido. Extrayendo..."
          mkdir -p linux-base
          dpkg-deb -x opera-gx-linux.deb linux-base/
          
          echo "📊 Estructura de Linux extraída:"
          echo "Total de archivos: $(find linux-base/ -type f | wc -l)"
      - name: "Fusión Segura (Linux Binarios + Windows Visuales)"
        run: |
          echo "Iniciando fusión segura..."
          mkdir -p patch-final
          
          # 1. Copiar la base nativa de Linux (binarios, .so, estructura)
          echo "Copiando base nativa de Linux..."
          cp -r linux-base/usr patch-final/
          
          # 2. Inyectar SOLO assets visuales y de UI desde Windows
          echo "Inyectando assets visuales de Windows..."
          
          # Filtramos por extensiones seguras para NO sobrescribir binarios Linux
          find windows-base/ -type f \( -name "*.png" -o -name "*.webp" -o -name "*.jpg" -o -name "*.ico" -o -name "*.wav" -o -name "*.mp3" -o -name "*.json" \) | while read file; do
            filename=$(basename "$file")
            cp "$file" "patch-final/usr/lib/opera-gx/$filename" 2>/dev/null || true
          done
          
          echo "Fusión completada."
          echo "Archivos finales en patch-final: $(find patch-final/ -type f | wc -l)"

      - name: "Generar script de instalación para Arch Linux"
        run: |
          cat << 'EOF' > patch-final/instalar.sh
          #!/bin/bash
          echo "🚫 Port Prohibido - Instalador para Arch Linux"
          echo "=============================================="
          
          if [ "$EUID" -ne 0 ]; then
              echo "❌ Error: Ejecuta con sudo (sudo ./instalar.sh)"
              exit 1
          fi
          
          OPERA_PATH="/usr/lib/opera-gx"
          if [ ! -d "$OPERA_PATH" ]; then
              echo "❌ Error: No se encontró Opera GX en $OPERA_PATH"
              echo "   Asegúrate de haberlo instalado desde AUR (yay -S opera-gx)"
              exit 1
          fi
          
          echo "✅ Opera GX detectado en $OPERA_PATH"
          echo "📦 Creando backup..."
          BACKUP="$OPERA_PATH-backup-$(date +%Y%m%d)"
          sudo cp -r "$OPERA_PATH" "$BACKUP"
          echo "✅ Backup creado en $BACKUP"
          
          echo "🎨 Aplicando assets de Windows (Splash, UI, Sonidos)..."
          sudo cp -r usr/lib/opera-gx/* "$OPERA_PATH/"
          
          echo "✅ ¡Patch aplicado con éxito!"
          echo "🔄 Reinicia Opera GX para ver los cambios."
          EOF
          chmod +x patch-final/instalar.sh

      - name: "Generar INSTRUCCIONES.md"
        run: |
          cat << 'EOF' > patch-final/INSTRUCCIONES.md
          # 🚫 Port Prohibido - Patch Visual para Opera GX (Arch Linux)
          
          ## Instalación Rápida
          ```bash
          unzip OperaGX-PortProhibido-Patch.zip
          cd OperaGX-PortProhibido-Patch
          sudo ./instalar.sh
          ```
          
          ## ¿Qué hace este patch?
          Reemplaza los assets visuales (Splash screen, iconos, sonidos de UI) de la versión nativa de Linux con los extraídos de la versión completa de Windows, manteniendo los binarios nativos de Linux para máximo rendimiento.
          EOF

      - name: "Empaquetar y Publicar Release"
        run: |
          cd patch-final
          zip -r ../OperaGX-PortProhibido-Patch.zip .
          cd ..
          
          echo "ZIP creado:"
          ls -lh OperaGX-PortProhibido-Patch.zip
          
      - name: "Subir Patch a Releases"
        uses: softprops/action-gh-release@v2
        with:
          files: OperaGX-PortProhibido-Patch.zip
          tag_name: "patch-fusion-v1.0"
          name: "🚫 Port Prohibido - Patch de Fusión (Windows Assets + Linux Core)"
          body: |
            ## Patch de Fusión Generado Automáticamente
            
            Este ZIP contiene la fusión segura entre el núcleo nativo de Linux y los assets visuales de Windows.
            
            ### 🚀 Instalación en Arch:
            ```bash
            unzip OperaGX-PortProhibido-Patch.zip
            cd OperaGX-PortProhibido-Patch
            sudo ./instalar.sh
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
