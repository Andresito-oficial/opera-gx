name: Port Prohibido - Análisis Windows y NVIDIA NIM
on:
  workflow_dispatch:

jobs:
  reverse-engineer-and-port:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: "Checkout del repositorio"
        uses: actions/checkout@v4

      - name: "Instalar herramientas (Radare2, 7z, Python)"
        run: |
          sudo apt-get update
          sudo apt-get install -y radare2 p7zip-full wget file python3 python3-pip
          pip install openai

      # ==========================================
      # 1. DESCARGAR Y EXTRAER SOLO WINDOWS
      # ==========================================
      - name: "Descargar y extraer Opera GX (Windows)"
        run: |
          set -euxo pipefail

          echo "Descargando instalador de Windows..."
          wget -O opera_gx_win_installer.exe "https://net.geo.opera.com/opera_gx/stable/windows"

          echo "Verificando el tipo de archivo..."
          file opera_gx_win_installer.exe || true

          echo "Creando directorio de extracción..."
          mkdir -p windows-base

          echo "Extrayendo el instalador inicial..."
          7z x opera_gx_win_installer.exe -o./windows-base/ -y || true

          echo "Listando lo que ha quedado dentro del instalador..."
          find windows-base -maxdepth 6 -type f | sed -n '1,200p' || true

          echo "Buscando binarios Windows reales dentro del instalador (incluye subdirectorios)..."
          mapfile -t ALL_EXES < <(find windows-base -type f -iname "*.exe" | sort)
          echo "Ejecutables encontrados: ${#ALL_EXES[@]}"
          for exe in "${ALL_EXES[@]}"; do
            echo "== $exe =="
            file "$exe" || true
          done

          echo "Intentando localizar el binario principal de Opera/GX o splash screen..."
          SPLASH_EXE=$(find windows-base -type f \( -iname "*opera*.exe" -o -iname "*splash*.exe" -o -iname "*launcher*.exe" -o -iname "*setup*.exe" \) | head -n 1)

          # Si el instalador trae un paquete interno o un SFX con un segundo exe, lo extraemos también.
          if [ -z "$SPLASH_EXE" ] && [ "${#ALL_EXES[@]}" -gt 0 ]; then
            for exe in "${ALL_EXES[@]}"; do
              if 7z l "$exe" >/dev/null 2>&1; then
                echo "Intentando extraer contenido anidado desde: $exe"
                7z x "$exe" -o"windows-base/nested_$(basename "$exe")" -y >/dev/null 2>&1 || true
              fi
            done
            SPLASH_EXE=$(find windows-base -type f \( -iname "*opera*.exe" -o -iname "*splash*.exe" -o -iname "*launcher*.exe" -o -iname "*setup*.exe" \) | head -n 1)
          fi

          if [ -z "$SPLASH_EXE" ]; then
            echo "No se encontró ningún exe de Opera GX en la extracción. Buscando cualquier PE ejecutable del paquete..."
            SPLASH_EXE=$(find windows-base -type f -iname "*.exe" | head -n 1)
          fi

          if [ -z "$SPLASH_EXE" ] || [ ! -f "$SPLASH_EXE" ]; then
            echo "❌ Error: No se encontró ningún binario para analizar."
            echo "Esto suele pasar cuando el instalador descargado es un stub o un paquete que embebe un segundo archivo en otra capa."
            exit 1
          fi

          echo "Archivo seleccionado: $SPLASH_EXE"
          echo "SPLASH_EXE_PATH=$SPLASH_EXE" >> "$GITHUB_ENV"

      # ==========================================
      # 2. DESCOMPILAR CON RADARE2
      # ==========================================
      - name: "Descompilar binario con Radare2"
        run: |
          echo "Extrayendo strings..."
          r2 -q -e scr.color=0 -c "iz > splash_strings.txt" "${{ env.SPLASH_EXE_PATH }}"
          echo "Analizando función main..."
          r2 -q -e scr.color=0 -c "aaa; afl; pdf @ main > splash_main_decompiled.txt" "${{ env.SPLASH_EXE_PATH }}"
          echo "Tamaño de los archivos generados:"
          ls -lh splash_strings.txt splash_main_decompiled.txt

      # ==========================================
      # 3. NVIDIA NIM GENERA EL CÓDIGO (NEMOTRON)
      # ==========================================
      - name: "NVIDIA NIM genera los cambios necesarios para el port"
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat << 'EOF' > nim_analyzer.py
          import os
          from openai import OpenAI

          client = OpenAI(
              base_url="https://integrate.api.nvidia.com/v1",
              api_key=os.environ["NVIDIA_API_KEY"]
          )

          with open("splash_main_decompiled.txt", "r") as f:
              decompiled_code = f.read()[:15000]
          with open("splash_strings.txt", "r") as f:
              strings_data = f.read()[:8000]

          prompt = f"""
          Actúa como un experto en ingeniería inversa y desarrollo en Linux.
          A continuación se muestra el código descompilado de la función 'main' y una lista de strings extraídos de un binario de Windows (Opera GX Splash).
          Tu tarea es analizar este código y proponer los cambios necesarios para portar su funcionalidad a Linux (por ejemplo, un script de Python que replique el comportamiento del splash screen).
          Sé conciso y proporciona ejemplos de código claros.

          ### Código Descompilado (main):
          {decompiled_code}

          ### Strings Extraídos:
          {strings_data}

          ### Propuesta de Port:
          """

          response = client.chat.completions.create(
              model="nvidia/nemotron-3-super-120b-a12b",
              messages=[{"role": "user", "content": prompt}],
              temperature=0.2,
              max_tokens=4096
          )

          print(response.choices[0].message.content)
          EOF
          python3 nim_analyzer.py
