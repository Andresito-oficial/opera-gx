name: Port Prohibido - Análisis y Generación con Qwen

on:
  workflow_dispatch:

jobs:
  reverse-engineer-with-qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "Checkout del repositorio"
        uses: actions/checkout@v4

      - name: "Instalar herramientas (Radare2, 7z, Python)"
        run: |
          sudo apt-get update
          sudo apt-get install -y radare2 p7zip-full wget curl file python3 python3-pip
          pip install openai

      - name: "Descargar y Analizar Opera GX (Windows)"
        run: |
          echo "Descargando instalador de Windows..."
          # Descarga la última versión de Opera GX para Windows
          wget -O opera_gx_win_installer.exe "https://net.geo.opera.com/opera_gx/stable/windows"
          
          echo "Verificando el tipo de archivo..."
          file opera_gx_win_installer.exe
          
          echo "Extrayendo el instalador con 7z..."
          mkdir -p windows-base
          7z x opera_gx_win_installer.exe -o./windows-base/ -y
          
          echo "Buscando el splash screen..."
          SPLASH_EXE=$(find windows-base/ -name "opera_gx_splash.exe" | head -n 1)
          if [ -z "$SPLASH_EXE" ]; then
            echo "No se encontró opera_gx_splash.exe, usando el primer .exe disponible."
            SPLASH_EXE=$(find windows-base/ -name "*.exe" | head -n 1)
          fi
          echo "Archivo seleccionado: $SPLASH_EXE"
          echo "SPLASH_EXE_PATH=$SPLASH_EXE" >> $GITHUB_ENV

      - name: "Descompilar el binario con Radare2"
        run: |
          echo "Extrayendo strings y descompilando..."
          r2 -q -e scr.color=0 -c "iz > splash_strings.txt" "${{ env.SPLASH_EXE_PATH }}"
          r2 -q -e scr.color=0 -c "aaa; afl; pdf @ main > splash_main_decompiled.txt" "${{ env.SPLASH_EXE_PATH }}"
          
          echo "=== Tamaño de los archivos generados ==="
          ls -lh splash_strings.txt splash_main_decompiled.txt

      - name: "Generar código con Qwen (IA)"
        env:
          # Necesitas configurar esta variable en GitHub Secrets
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }} 
        run: |
          cat << 'EOF' > qwen_analyzer.py
          import os
          from openai import OpenAI

          # Configurar el cliente para usar la API compatible de Qwen
          client = OpenAI(
              api_key=os.environ.get("DASHSCOPE_API_KEY", "dummy_key"),
              base_url="https://dashscope.aliyuncs.com/compatible-mode/v1"
          )

          # Leer el código descompilado y los strings
          with open("splash_main_decompiled.txt", "r") as f:
              decompiled_code = f.read()[:10000] # Limitar para no exceder tokens
              
          with open("splash_strings.txt", "r") as f:
              strings_data = f.read()[:5000]

          prompt = f"""
          Actúa como un experto en ingeniería inversa de software y desarrollo en C/C++.
          Tengo el código descompilado de un binario de Windows (opera_gx_splash.exe).
          Mi objetivo es portarlo a Linux o crear un parche para que no dependa de las APIs de Windows.

          Aquí tienes los Strings encontrados:
          {strings_data}

          Aquí tienes la función principal descompilada:
          {decompiled_code}

          Por favor:
          1. Analiza qué hace el binario.
          2. Genera el código en C o C++ necesario para replicar esta funcionalidad en Linux.
          3. Si ves llamadas a la API de Windows (como CreateWindow, MessageBox, etc.), sugiere sus equivalentes en GTK o Qt.
          4. Escribe el código resultante de forma clara.
          """

          try:
              response = client.chat.completions.create(
                  model="qwen-coder-plus", # o qwen-max, qwen-plus
                  messages=[
                      {"role": "system", "content": "Eres un experto en reversing y portabilidad de software."},
                      {"role": "user", "content": prompt}
                  ],
                  temperature=0.2
              )
              
              with open("qwen_port_strategy.md", "w") as out:
                  out.write(response.choices[0].message.content)
              print("✅ Análisis de Qwen generado con éxito.")
          except Exception as e:
              print(f"❌ Error contactando a la API de Qwen: {e}")
              # Fallback para que no falle el workflow si no hay API key
              with open("qwen_port_strategy.md", "w") as out:
                  out.write("# Error\nNo se pudo conectar a la API de Qwen. Revisa tu DASHSCOPE_API_KEY.")
          EOF
          
          python3 qwen_analyzer.py

      - name: "Empaquetar resultados"
        run: |
          mkdir -p dist
          cp splash_main_decompiled.txt dist/
          cp splash_strings.txt dist/
          cp qwen_port_strategy.md dist/
          
          tar -czvf dist/Opera-GX-Reverse-Port.tar.gz -C dist/ .
          echo "¡Port generado con éxito!"

      - name: "Subir artefacto"
        uses: actions/upload-artifact@v4
        with:
          name: Opera-GX-Qwen-Port
          path: dist/Opera-GX-Reverse-Port.tar.gz
