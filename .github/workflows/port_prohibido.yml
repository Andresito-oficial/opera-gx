name: Port Prohibido - Reverse Engineering y Port

on:
  workflow_dispatch:

jobs:
  reverse-engineer-and-port:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: "Checkout del repositorio"
        uses: actions/checkout@v4

      - name: "Instalar herramientas (Radare2, 7z, Wine, etc.)"
        run: |
          sudo apt-get update
          # Instalamos Radare2, 7zip y binutils para análisis de binarios
          sudo apt-get install -y radare2 p7zip-full wget curl file binutils

      # ==========================================
      # 1. DESCARGA Y EXTRACCIÓN DEL .EXE DE WINDOWS
      # ==========================================
      - name: "Descargar y Analizar Opera GX (Windows)"
        run: |
          echo "Descargando instalador de Windows..."
          wget -O opera_gx_win_installer.exe "https://net.geo.opera.com/opera_gx/stable/windows"
          
          echo "Verificando el tipo de archivo..."
          file opera_gx_win_installer.exe
          
          echo "Extrayendo el instalador con 7z..."
          mkdir -p windows-base
          # 7z puede extraer los archivos internos de los instaladores NSIS/InnoSetup
          7z x opera_gx_win_installer.exe -o./windows-base/ -y
          
          echo "Buscando el splash screen y otros binarios..."
          find windows-base/ -type f -name "*.exe" | head -n 20

      # ==========================================
      # 2. DESCOMPILACIÓN CON RADARE2 (El "Port" Real)
      # ==========================================
      - name: "Descompilar opera_gx_splash.exe"
        run: |
          # Buscamos el archivo en la carpeta extraída
          SPLASH_EXE=$(find windows-base/ -name "opera_gx_splash.exe" | head -n 1)
          
          if [ -z "$SPLASH_EXE" ]; then
            echo "No se encontró opera_gx_splash.exe. Buscando otros..."
            SPLASH_EXE=$(find windows-base/ -name "*.exe" | head -n 1)
          fi
          
          echo "Analizando $SPLASH_EXE..."
          
          # 1. Extraer strings (útil para buscar comandos, URLs o textos)
          r2 -q -e scr.color=0 -c "iz > splash_strings.txt" "$SPLASH_EXE"
          cat splash_strings.txt
          
          # 2. Análisis de la función main
          r2 -q -e scr.color=0 -c "aaa; afl; pdf @ main > splash_main_decompiled.txt" "$SPLASH_EXE"
          cat splash_main_decompiled.txt
          
          # 3. Extraer los recursos PE (iconos, bitmaps)
          # r2 tiene un módulo para volcar recursos (esto es un ejemplo)
          r2 -q -e scr.color=0 -c "iR > splash_resources.txt" "$SPLASH_EXE"
          cat splash_resources.txt

      # ==========================================
      # 3. PREPARAR LA BASE DE LINUX
      # ==========================================
      - name: "Descargar y extraer Opera GX (Linux)"
        run: |
          echo "Descargando .deb de Linux..."
          wget -O opera_gx_linux.deb "https://get.opera.com/pub/opera_gx/stable/linux/opera-gx-stable_129.0.5823.26_amd64.deb"
          
          echo "Extrayendo .deb..."
          mkdir -p linux-base
          dpkg-deb -x opera_gx_linux.deb linux-base/
          
          echo "Estructura de Linux lista en linux-base/"

      # ==========================================
      # 4. INYECCIÓN / PARCHEO (El Port)
      # ==========================================
      - name: "Inyectar recursos descompilados en Linux"
        run: |
          LINUX_DIR="linux-base/usr/lib/opera-gx"
          
          # Aquí es donde harías tu magia. Por ejemplo, si parcheaste el splash:
          # cp windows-base/opera_gx_splash.exe "$LINUX_DIR/" (si usas Wine para ejecutarlo)
          
          # O si extrajiste los recursos (imágenes, sonidos) y los quieres meter en el .pak
          # Necesitarías herramientas como "pak_util" de Chromium.
          
          echo "¡Archivos preparados para el port!"

      # ==========================================
      # 5. EMPAQUETAR EL RESULTADO
      # ==========================================
      - name: "Empaquetar el port final"
        run: |
          mkdir -p dist
          # Empaquetamos todo el entorno de Linux
          tar -czvf dist/Opera-GX-Port-Linux.tar.gz -C linux-base/ .
          
          echo "¡Port generado en dist/Opera-GX-Port-Linux.tar.gz!"

      - name: "Subir artefacto"
        uses: actions/upload-artifact@v4
        with:
          name: Opera-GX-Port-Descompilado
          path: dist/Opera-GX-Port-Linux.tar.gz
