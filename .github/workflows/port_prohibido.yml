name: Port Prohibido - Reparación Total con Winget y NVIDIA NIM
on:
  workflow_dispatch:

jobs:
  reverse-engineer-and-port:
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: read

    steps:
      - name: "Checkout del repositorio"
        uses: actions/checkout@v4

      - name: "Instalar herramientas (Radare2, Python)"
        run: |
          choco install radare2 -y
          pip install openai

      # ==========================================
      # 1. INSTALAR OPERA GX Y BUSCAR ARCHIVOS
      # ==========================================
      - name: "Instalar Opera GX vía Winget y listar archivos"
        shell: pwsh
        run: |
          echo "Instalando Opera GX..."
          winget install --id Opera.OperaGX -e --silent --accept-package-agreements --accept-source-agreements
          Start-Sleep -Seconds 15
          
          $common_paths = @(
            "$env:LOCALAPPDATA\Programs\Opera GX",
            "C:\Program Files\Opera GX",
            "C:\Program Files (x86)\Opera GX"
          )
          
          $install_dir = $null
          foreach ($path in $common_paths) {
            if (Test-Path $path) { $install_dir = $path; break }
          }
          
          if (-not $install_dir) {
            Write-Host "[ERROR] No se encontró la carpeta de instalación."
            exit 1
          }
          echo "Directorio encontrado: $install_dir"

          # Buscamos TODOS los archivos relevantes
          $extensions = @("*.exe", "*.dll", "*.json", "*.ini", "*.xml")
          $files = Get-ChildItem -Path $install_dir -Recurse -Include $extensions | Select-Object -ExpandProperty FullName
          
          $files | Out-File -FilePath files_list.txt -Encoding utf8
          Write-Host "Total de componentes a analizar: $($files.Count)"

      # ==========================================
      # 2. ANALIZAR CON PYTHON + NIM
      # ==========================================
      - name: "Reparar y Portar con NVIDIA NIM"
        shell: pwsh # <-- Cambiado a PowerShell
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          # Escribimos el archivo de Python con la sintaxis de PowerShell (Here-String)
          @'
          import os
          import time
          import subprocess
          from openai import OpenAI, RateLimitError, NotFoundError, APIStatusError

          client = OpenAI(
              base_url="https://integrate.api.nvidia.com/v1",
              api_key=os.environ["NVIDIA_API_KEY"]
          )

          with open("files_list.txt", "r", encoding="utf-8-sig") as f:
              files = [line.strip() for line in f if line.strip()]

          report_file = "Reporte_Reparacion_OperaGX.md"
          with open(report_file, "w", encoding="utf-8") as f:
              f.write("# Reporte de Portabilidad y Reparacion\n\n")

          for file_path in files:
              file_name = os.path.basename(file_path)
              ext = file_path.split('.')[-1].lower()
              print(f"Analizando: {file_name}...")

              prompt = ""

              if ext in ['exe', 'dll']:
                  strings_data = ""
                  exports_data = ""
                  
                  try:
                      # Ejecutamos Radare2 usando subprocess (evita errores de rutas en Windows)
                      res_strings = subprocess.run(["r2", "-q", "-e", "scr.color=0", "-c", "iz", file_path], capture_output=True, text=True, encoding="utf-8", errors="ignore")
                      strings_data = res_strings.stdout[:3000]
                      
                      res_exports = subprocess.run(["r2", "-q", "-e", "scr.color=0", "-c", "iE", file_path], capture_output=True, text=True, encoding="utf-8", errors="ignore")
                      exports_data = res_exports.stdout[:3000]
                  except Exception as e:
                      print(f"  [WARN] Error ejecutando Radare2: {e}")
                  
                  prompt = f"""
                  Analiza este binario/libreria de Windows: "{file_name}".
                  1. Deduce su proposito.
                  2. Identifica funciones exportadas clave (si es DLL) o APIs criticas.
                  3. Propon la estrategia exacta para portarlo a Linux.

                  EXPORTS:
                  {exports_data}

                  STRINGS:
                  {strings_data}
                  """
              else:
                  try:
                      with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                  except Exception:
                      content = "[Archivo binario o ilegible]"
                  
                  if len(content) > 5000:
                      content = content[:5000] + "\n...[TRUNCADO]..."

                  prompt = (
                      'Analiza este archivo de configuracion de Windows: "' + file_name + '".\n'
                      '1. Identifica las partes del codigo que romperan en Linux.\n'
                      '2. Reescribe el CONTENIDO COMPLETO adaptandolo a Linux.\n'
                      '3. Devuelve SOLO el bloque de codigo reparado.\n\n'
                      'CONTENIDO ORIGINAL:\n```\n' + content + '\n```'
                  )

              payload_model = "nvidia/nemotron-3.5-super-vl-120b-a12b"
              success = False
              retries = 0

              while not success and retries < 3:
                  try:
                      response = client.chat.completions.create(
                          model=payload_model,
                          messages=[{"role": "user", "content": prompt}],
                          temperature=0.2,
                          max_tokens=2048
                      )
                      result = response.choices[0].message.content
                      
                      with open(report_file, "a", encoding="utf-8") as f:
                          f.write(f"\n\n## Componente: `{file_name}`\n")
                          f.write(f"**Tipo:** {ext.upper()}\n\n")
                          f.write(f"{result}\n")
                      
                      print(f"[OK] {file_name} analizado.")
                      success = True
                      
                  except RateLimitError:
                      print("[WARN] Limite de RPM alcanzado. Esperando 15 segundos...")
                      time.sleep(15)
                      retries += 1
                  except NotFoundError:
                      print("[ERROR] Modelo no encontrado.")
                      break
                  except APIStatusError as e:
                      if e.status_code == 410:
                          print(f"[WARN] El modelo {payload_model} ya no esta disponible. Cambiando a Lightning...")
                          payload_model = "nvidia/nemotron-3.5-lightning-30b-a3b"
                          retries += 1
                      else:
                          print(f"[ERROR] Error de API ({e.status_code}) con {file_name}: {e}")
                          success = True
                  except Exception as e:
                      print(f"[ERROR] Error inesperado con {file_name}: {e}")
                      success = True
                          
              time.sleep(2)

          print("[DONE] Proceso de reparacion completado.")
          '@ | Out-File -FilePath nim_analyzer.py -Encoding utf8
          
          # Ejecutamos el script
          python nim_analyzer.py
      - name: "Empaquetar y subir los binarios de Opera GX"
        if: always()
        shell: pwsh
        run: |
          # Buscamos la carpeta de instalación otra vez
          $common_paths = @(
            "$env:LOCALAPPDATA\Programs\Opera GX",
            "C:\Program Files\Opera GX",
            "C:\Program Files (x86)\Opera GX"
          )
          $install_dir = $null
          foreach ($path in $common_paths) {
            if (Test-Path $path) { $install_dir = $path; break }
          }

          if ($install_dir) {
            Write-Host "Comprimiendo binarios desde: $install_dir"
            # Comprimimos la carpeta entera en un archivo .zip
            Compress-Archive -Path "$install_dir\*" -DestinationPath "OperaGX-Binaries.zip" -Force
            Write-Host "Binarios comprimidos con éxito."
          } else {
            Write-Host "[ERROR] No se encontró la carpeta para comprimir."
          }

      - name: "Subir binarios al repositorio"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opera-gx-binarios
          path: OperaGX-Binaries.zip

      - name: "Subir reporte de reparación"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-reparacion-opera-gx
          path: Reporte_Reparacion_OperaGX.md
