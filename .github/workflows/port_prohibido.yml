name: Port Prohibido - Análisis Windows y NVIDIA NIM
on:
  workflow_dispatch:

jobs:
  reverse-engineer-and-port:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: "Checkout del repositorio"
        uses: actions/checkout@v4

      - name: "Instalar herramientas (Radare2, Python)"
        run: |
          # Usamos Chocolatey (preinstalado en los runners de Windows) para Radare2
          choco install radare2 -y
          # Instalamos el cliente de OpenAI para Python
          pip install openai

      # ==========================================
      # 1. INSTALAR OPERA GX CON WINGET
      # ==========================================
      - name: "Instalar Opera GX vía Winget"
        run: |
          echo "Instalando Opera GX..."
          # El ID oficial en winget es Opera.OperaGX
          winget install --id Opera.OperaGX -e --silent --accept-package-agreements --accept-source-agreements
          
          # Damos unos segundos por si el instalador necesita terminar de configurar
          Start-Sleep -Seconds 10

      - name: "Localizar los binarios de Opera GX"
        id: find_exe
        shell: pwsh
        run: |
          # Buscamos el opera.exe en las rutas comunes de instalación
          $common_paths = @(
            "$env:LOCALAPPDATA\Programs\Opera GX",
            "C:\Program Files\Opera GX",
            "C:\Program Files (x86)\Opera GX"
          )
          
          $exe_path = $null
          foreach ($path in $common_paths) {
            if (Test-Path $path) {
              $found = Get-ChildItem -Path $path -Filter "opera.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                $exe_path = $found.FullName
                break
              }
            }
          }

          if (-not $exe_path) {
            Write-Host "❌ No se encontró opera.exe. Listando archivos en LOCALAPPDATA:"
            Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter "opera.exe" -ErrorAction SilentlyContinue | Select-Object FullName
            exit 1
          }

          Write-Host "Binario encontrado en: $exe_path"
          echo "SPLASH_EXE_PATH=$exe_path" >> $env:GITHUB_ENV

      # ==========================================
      # 2. DESCOMPILAR CON RADARE2
      # ==========================================
      - name: "Descompilar binario con Radare2"
        shell: pwsh
        run: |
          echo "Extrayendo strings..."
          # Usamos el path absoluto de r2 instalado por chocolatey
          r2 -q -e scr.color=0 -c "iz" "$env:SPLASH_EXE_PATH" > splash_strings.txt
          
          echo "Analizando función main..."
          # En Windows, pdf @ main a veces falla si no hay símbolos, así que usamos 's main; pdf' o 'aaa; s main; pdf'
          r2 -q -e scr.color=0 -c "aaa; s main; pdf" "$env:SPLASH_EXE_PATH" > splash_main_decompiled.txt
          
          Write-Host "Tamaño de los archivos generados:"
          Get-Item splash_strings.txt, splash_main_decompiled.txt | Select-Object Name, Length

            # ==========================================
      # 3. NVIDIA NIM GENERA EL CÓDIGO (NEMOTRON)
      # ==========================================
      - name: "NVIDIA NIM genera los cambios necesarios para el port"
        shell: bash # <--- CAMBIO: Usar bash en lugar de pwsh para el heredoc
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat << 'EOF' > nim_analyzer.py
          import os
          from openai import OpenAI

          client = OpenAI(
              base_url="https://integrate.api.nvidia.com/v1",
              api_key=os.environ["NVIDIA_API_KEY"]
          )

          with open("splash_main_decompiled.txt", "r", encoding="utf-8") as f:
              decompiled_code = f.read()[:15000]
          with open("splash_strings.txt", "r", encoding="utf-8") as f:
              strings_data = f.read()[:8000]

          prompt = f"""
          Actúa como un experto en ingeniería inversa y desarrollo en Linux.
          A continuación se muestra el código descompilado de la función 'main' y una lista de strings extraídos de un binario de Windows (Opera GX Splash).
          Tu tarea es analizar este código y proponer los cambios necesarios para portar su funcionalidad a Linux (por ejemplo, un script de Python que replique el comportamiento del splash screen).
          Sé conciso y proporciona ejemplos de código claros.

          ### Código Descompilado (main):
          {decompiled_code}

          ### Strings Extraídos:
          {strings_data}

          ### Propuesta de Port:
          """

          response = client.chat.completions.create(
              model="nvidia/nemotron-3-super-120b-a12b",
              messages=[{"role": "user", "content": prompt}],
              temperature=0.2,
              max_tokens=4096
          )

          print(response.choices[0].message.content)
          EOF
          python nim_analyzer.py
