name: Port Prohibido - Opera GX 100% Nativo (Chromium + Assets Windows)

on:
  workflow_dispatch: # Ejecución manual recomendada por el alto coste de cómputo
  # schedule:
  #   - cron: '0 0 1 * *' # Descomentar para compilación mensual automática

permissions:
  contents: write

jobs:
  # FASE 1: Extracción de los "Huesos" del binario de Windows
  extract-windows-assets:
    name: Fase 1: Extracción de Assets (Windows)
    runs-on: ubuntu-latest
    outputs:
      gx_version: ${{ steps.extract.outputs.gx_version }}
    steps:
      - name: Descargar el espécimen (Opera GX Windows)
        run: |
          echo "🔓 Iniciando extracción de recursos del binario oficial de Windows..."
          curl -L -o OperaGXSetup.exe "https://net.geo.opera.com/opera_gx/stable/windows"
          mkdir -p gx-assets
          7z x OperaGXSetup.exe -ogx-assets/ -y
          
      - name: Diseccionar y extraer recursos clave
        id: extract
        run: |
          VERSION_DIR=$(ls -d gx-assets/*/ | head -n 1)
          echo "gx_version=$(basename $VERSION_DIR)" >> $GITHUB_OUTPUT
          
          mkdir -p extracted-resources
          echo "💀 Extrayendo ADN visual y de configuración (.pak, .json, .png, .wav)..."
          find "$VERSION_DIR" -name "*.pak" -exec cp {} extracted-resources/ \; 2>/dev/null || true
          find "$VERSION_DIR" -name "*.json" -exec cp {} extracted-resources/ \; 2>/dev/null || true
          find "$VERSION_DIR" \( -name "*.png" -o -name "*.ico" -o -name "*.wav" \) -exec cp {} extracted-resources/ \; 2>/dev/null || true
          
      - name: Preservar artefactos para la compilación
        uses: actions/upload-artifact@v4
        with:
          name: gx-assets-prohibido
          path: extracted-resources/

  # FASE 2: La Forja Nativa (Compilación de Chromium)
  compile-chromium-native:
    name: Fase 2: La Forja Nativa (Linux)
    needs: extract-windows-assets
    runs-on: ubuntu-latest # ⚠️ CRÍTICO: Para producción real, usa un runner self-hosted con 16GB+ RAM
    timeout-minutes: 360 
    
    steps:
      - name: Preparar el terreno (Swap de emergencia)
        run: |
          echo "🛡️ Activando 8GB de Swap para evitar que el runner colapse por OOM..."
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Recuperar los assets extraídos
        uses: actions/download-artifact@v4
        with:
          name: gx-assets-prohibido
          path: gx-assets/

      - name: Instalar herramientas de la forja
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 curl xz-utils jq \
            build-essential pkg-config libgtk-3-dev libx11-dev \
            libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev

      - name: Clonar el motor (Chromium Official)
        run: |
          echo "📥 Descargando el código fuente oficial de Chromium..."
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH="$PWD/depot_tools:$PATH"
          echo "PATH=$PATH" >> $GITHUB_ENV
          
          mkdir chromium && cd chromium
          fetch --no-history chromium
          cd src
          git checkout main # O puedes fijar una versión específica: git checkout tags/120.0.6099.109

      - name: Inyectar el "Disfraz" (Branding y Recursos GX)
        run: |
          cd chromium/src
          echo "🎭 Inyectando el ADN de Opera GX en el motor nativo..."
          
          # 1. Reemplazar iconos y recursos visuales
          cp ../../gx-assets/*.png chrome/app/theme/default_100_percent/chromium/ 2>/dev/null || true
          cp ../../gx-assets/*.ico chrome/app/theme/ 2>/dev/null || true
          
          # 2. Modificar cadenas de texto
          sed -i 's/Chromium/Opera GX/g' chrome/app/chromium_strings.grd
          sed -i 's/Google Chrome/Opera GX/g' chrome/app/generated_resources.grd
          
          # 3. PUNTO DE CONTROL: Si algo se ve "raro", aplica tu parche aquí:
          # git apply ../../gx-custom-patch.patch || echo "⚠️ Parche no aplicado, continuando..."

      - name: Configurar la compilación nativa (Optimizada para CI)
        run: |
          cd chromium/src
          echo "⚙️ Configurando parámetros de compilación para Linux x64..."
          gn gen out/Default --args='
            is_debug=false
            is_official_build=true
            symbol_level=0
            use_thin_lto=false
            use_sysroot=false
            treat_warnings_as_errors=false
            enable_nacl=false
            enable_hangout_services_extension=false
            enable_widevine=true
            target_os="linux"
            target_cpu="x64"
            use_allocator="none"
          '

      - name: Compilar el núcleo (Ninja)
        run: |
          cd chromium/src
          echo "🔥 Iniciando la forja. Esto tomará tiempo (limitado a 4 jobs para salvar la RAM)..."
          ninja -C out/Default chrome -j 4

      - name: El Toque Final: libffmpeg de Ld-Hagen
        run: |
          echo "💉 Inyectando libffmpeg.so nativa de Ld-Hagen (Fix de Twitch/DRM)..."
          FFMPEG_URL=$(curl -s https://api.github.com/repos/Ld-Hagen/fix-opera-linux-ffmpeg-widevine/releases/latest \
            | jq -r '.assets[] | select(.name | match(".*-linux-x64\\.zip$")) | .browser_download_url' | head -n 1)
          wget -O ffmpeg.zip "$FFMPEG_URL"
          unzip -o ffmpeg.zip -d ffmpeg-temp/
          
          TARGET_FFMPEG=$(find chromium/src/out/Default -name "libffmpeg.so" | head -n 1)
          cp ffmpeg-temp/libffmpeg.so "$TARGET_FFMPEG"
          echo "✅ Inyección completada. Codecs nativos listos."

      - name: Empaquetar el Artefacto Final (AppImage)
        run: |
          mkdir -p OperaGX-Native.AppDir/usr/bin
          
          cat << 'EOF' > OperaGX-Native.AppDir/opera-gx.desktop
          [Desktop Entry]
          Name=Opera GX
          Comment=Port Prohibido: 100% Native Linux (Chromium Base + GX Assets)
          Exec=AppRun
          Icon=opera-gx
          Type=Application
          Categories=Network;WebBrowser;
          EOF
          
          wget -q -O OperaGX-Native.AppDir/opera-gx.png "https://upload.wikimedia.org/wikipedia/commons/8/89/Opera_GX_Icon.png" || \
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > OperaGX-Native.AppDir/opera-gx.png
          
          cat << 'EOF' > OperaGX-Native.AppDir/AppRun
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          echo "🚀 Iniciando Port Prohibido (100% Nativo, CERO Wine/Box64)..."
          exec "$HERE/usr/bin/chrome" --no-sandbox --disable-gpu-sandbox "$@"
          EOF
          chmod +x OperaGX-Native.AppDir/AppRun
          
          cp chromium/src/out/Default/chrome OperaGX-Native.AppDir/usr/bin/
          cp -r chromium/src/out/Default/locales OperaGX-Native.AppDir/usr/bin/ 2>/dev/null || true
          cp -r chromium/src/out/Default/resources OperaGX-Native.AppDir/usr/bin/ 2>/dev/null || true

      - name: Sellado del AppImage
        run: |
          export ARCH=x86_64
          LATEST_TOOL=$(curl -s https://api.github.com/repos/AppImage/appimagetool/releases/latest \
            | jq -r '.assets[] | select(.name | endswith("-x86_64.AppImage")) | .browser_download_url' | head -n 1)
          wget -O appimagetool "$LATEST_TOOL"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run OperaGX-Native.AppDir OperaGX-PortProhibido-x86_64.AppImage

      - name: Publicar el Port Prohibido
        uses: softprops/action-gh-release@v2
        with:
          files: OperaGX-PortProhibido-x86_64.AppImage
          tag_name: "port-prohibido-v1.0"
          name: "🚫 Port Prohibido: Opera GX 100% Nativo para Linux"
          body: |
            ## 🚫 PORT PROHIBIDO: Opera GX 100% Nativo
            
            > *"Lo que la empresa no lanzó, la comunidad lo forja."*
            
            Este no es un wrapper. No es Wine. No es Box64. 
            Este es un **port nativo real** construido mediante ingeniería de sistemas:
            
            ### 🔧 La Alquimia:
            1. **Motor:** Compilado desde cero usando el código fuente oficial de Chromium para Linux.
            2. **Identidad:** Recursos, temas y configuraciones extraídos quirúrgicamente del binario oficial de Windows.
            3. **Codecs:** Inyección automática de `libffmpeg.so` de **Ld-Hagen** para garantizar Twitch, DRM y streams sin fallos.
            
            ### ⚠️ Notas del Creador:
            - Si algo se comporta de forma "rara", el código fuente de Chromium está disponible para aplicar parches `.patch` específicos en el paso de "Inyección del Disfraz".
            - Requiere un sistema Linux x86_64. Ejecutar con `chmod +x` y `./OperaGX-PortProhibido-x86_64.AppImage`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
