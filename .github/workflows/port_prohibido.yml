name: Port Prohibido - Opera GX 100% Nativo (Motor Linux + Splash Screen)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-linux-native:
    name: "Fase 1 - Extraccion Motor Linux"
    runs-on: ubuntu-latest
    outputs:
      gx_version: ${{ steps.extract.outputs.gx_version }}
    steps:
      - name: "Descargar Opera GX Linux (.deb)"
        run: |
          echo "Descargando motor nativo de Linux..."
          curl -L -o opera-gx-linux.deb "https://download3.operacdn.com/pub/opera_gx/stable/linux"
          ls -lh opera-gx-linux.deb
      
      - name: "Extraer motor de Linux"
        id: extract
        run: |
          mkdir -p linux-assets extracted-resources
          dpkg-deb -x opera-gx-linux.deb linux-assets/
          
          echo "Estructura de Linux extraida:"
          find linux-assets/ -type f | head -n 30
          
          # Buscar el directorio de Opera GX
          LINUX_DIR=$(find linux-assets/ -type d -name "opera-gx" -o -name "opera" | head -n 1)
          
          if [ -n "$LINUX_DIR" ] && [ -d "$LINUX_DIR" ]; then
            echo "Extrayendo recursos de Linux desde $LINUX_DIR..."
            find "$LINUX_DIR" \( -name "*.so" -o -name "*.json" -o -name "opera" -o -name "*.pak" \) -exec cp {} extracted-resources/ \; 2>/dev/null || true
          fi
          
          # Extraer version
          VERSION="unknown"
          if [ -n "$LINUX_DIR" ] && [ -f "$LINUX_DIR/product_version" ]; then
            VERSION=$(cat "$LINUX_DIR/product_version")
          fi
          echo "gx_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          
          # Verificar
          FILE_COUNT=$(find extracted-resources/ -type f | wc -l)
          echo "Archivos extraidos de Linux: $FILE_COUNT"
      
      - name: "Listar contenido"
        run: |
          echo "=== Recursos de Linux ==="
          ls -lh extracted-resources/ | head -n 40
          echo ""
          echo "Total: $(find extracted-resources/ -type f | wc -l) archivos"
      
      - name: "Preservar artefactos"
        uses: actions/upload-artifact@v4
        with:
          name: gx-linux-native
          path: extracted-resources/
          if-no-files-found: error

  inject-splash-screen:
    name: "Fase 2 - Inyeccion Splash Screen"
    needs: extract-linux-native
    runs-on: ubuntu-latest
    steps:
      - name: "Recuperar motor Linux"
        uses: actions/download-artifact@v4
        with:
          name: gx-linux-native
          path: gx-linux/
      
      - name: "Subir splash screen (tú lo subes aquí)"
        uses: actions/upload-artifact@v4
        with:
          name: gx-splash-screen
          path: splash-screen/
          if-no-files-found: error
      
      - name: "Inyectar splash screen"
        run: |
          mkdir -p final-assets
          
          # Copiar motor Linux
          cp -r gx-linux/* final-assets/ 2>/dev/null || true
          
          # Inyectar splash screen
          echo "Inyectando splash screen..."
          cp -r splash-screen/* final-assets/ 2>/dev/null || true
          
          echo "=== Recursos finales ==="
          ls -lh final-assets/ | head -n 40
          echo ""
          echo "Total: $(find final-assets/ -type f | wc -l) archivos"
      
      - name: "Preservar artefactos finales"
        uses: actions/upload-artifact@v4
        with:
          name: gx-final-assets
          path: final-assets/
          if-no-files-found: error

  compile-chromium-native:
    name: "Fase 3 - La Forja Nativa Linux"
    needs: inject-splash-screen
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: "Preparar el terreno con Swap"
        run: |
          echo "Activando 8GB de Swap..."
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      
      - name: "Recuperar assets finales"
        uses: actions/download-artifact@v4
        with:
          name: gx-final-assets
          path: gx-assets/
      
      - name: "Verificar assets"
        run: |
          echo "Verificando assets..."
          ls -lh gx-assets/ | head -n 30
          FILE_COUNT=$(find gx-assets/ -type f | wc -l)
          echo "Total: $FILE_COUNT archivos"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No hay assets"
            exit 1
          fi
      
      - name: "Instalar herramientas de compilacion"
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 curl xz-utils jq \
            build-essential pkg-config libgtk-3-dev libx11-dev \
            libxkbcommon-x11-dev libxkbcommon
