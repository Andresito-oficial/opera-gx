name: Port Prohibido - Análisis Windows y NVIDIA NIM
on: workflow_dispatch:
jobs:
  reverse-engineer-and-port:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: "Checkout del repositorio"
        uses: actions/checkout@v4

      - name: "Instalar herramientas (Radare2, 7z, Python)"
        run: |
          sudo apt-get update
          sudo apt-get install -y radare2 p7zip-full wget file python3 python3-pip
          pip install openai

      # ==========================================
      # 1. DESCARGAR Y EXTRAER SOLO WINDOWS
      # ==========================================
      - name: "Descargar y extraer Opera GX (Windows)"
        run: |
          echo "Descargando instalador de Windows..."
          wget -O opera_gx_win_installer.exe "https://net.geo.opera.com/opera_gx/stable/windows"
          echo "Verificando el tipo de archivo..."
          file opera_gx_win_installer.exe
          echo "Extrayendo el instalador con 7z (adiós problemas de untar)..."
          mkdir -p windows-base
          7z x opera_gx_win_installer.exe -o./windows-base/ -y
          echo "Buscando el splash screen..."
          SPLASH_EXE=$(find windows-base/ -name "opera_gx_splash.exe" | head -n 1)
          if [ -z "$SPLASH_EXE" ]; then
            echo "No se encontró opera_gx_splash.exe, buscando otro binario principal..."
            SPLASH_EXE=$(find windows-base/ -name "opera.exe" | head -n 1)
          fi
          if [ -z "$SPLASH_EXE" ]; then
            echo "❌ Error: No se encontró ningún binario para analizar."
            exit 1
          fi
          echo "Archivo seleccionado: $SPLASH_EXE"
          echo "SPLASH_EXE_PATH=$SPLASH_EXE" >> $GITHUB_ENV

      # ==========================================
      # 2. DESCOMPILAR CON RADARE2
      # ==========================================
      - name: "Descompilar binario con Radare2"
        run: |
          echo "Extrayendo strings..."
          r2 -q -e scr.color=0 -c "iz > splash_strings.txt" "${{ env.SPLASH_EXE_PATH }}"
          echo "Analizando función main..."
          r2 -q -e scr.color=0 -c "aaa; afl; pdf @ main > splash_main_decompiled.txt" "${{ env.SPLASH_EXE_PATH }}"
          echo "Tamaño de los archivos generados:"
          ls -lh splash_strings.txt splash_main_decompiled.txt

      # ==========================================
      # 3. NVIDIA NIM GENERA EL CÓDIGO (NEMOTRON)
      # ==========================================
      - name: "NVIDIA NIM genera los cambios necesarios para el port"
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          cat << 'EOF' > nim_analyzer.py
          import os
          from openai import OpenAI

          client = OpenAI(
              base_url="https://integrate.api.nvidia.com/v1",
              api_key=os.environ["NVIDIA_API_KEY"]
          )

          with open("splash_main_decompiled.txt", "r") as f:
              decompiled_code = f.read()[:15000]
          with open("splash_strings.txt", "r") as f:
              strings_data = f.read()[:8000]

          prompt = f"""
          Actúa como un experto en ingeniería inversa y desarrollo en Linux.
          A continuación se muestra el código descompilado de la función 'main' y una lista de strings extraídos de un binario de Windows (Opera GX Splash).
          Tu tarea es analizar este código y proponer los cambios necesarios para portar su funcionalidad a Linux (por ejemplo, un script de Python que replique el comportamiento del splash screen).
          Sé conciso y proporciona ejemplos de código claros.

          ### Código Descompilado (main):
          {decompiled_code}

          ### Strings Extraídos:
          {strings_data}

          ### Propuesta de Port:
          """

          # Uso del modelo Nemotron 120B de NVIDIA
          response = client.chat.completions.create(
              model="nvidia/nemotron-3-super-120b-a12b",
              messages=[{"role": "user", "content": prompt}],
              temperature=0.2,
              max_tokens=4096
          )

          print(response.choices[0].message.content)
          EOF
          python3 nim_analyzer.py
