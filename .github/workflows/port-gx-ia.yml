name: Agente de Porting - Primer Lanzamiento con IA y Descompilador

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile-and-ai-port:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar tu repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Corrección de Radare2 utilizando el instalador oficial optimizado para pipelines
      - name: Instalar dependencias y Radare2 nativo
        run: |
          sudo apt-get update
          sudo apt-get install -y wget p7zip-full curl jq git xz-utils make gcc
          
          echo "Descargando e instalando Radare2 optimizado para Integración Continua..."
          # Clonación directa del repositorio oficial de Radare2
          git clone --depth 1 https://github.com/radareorg/radare2.git
          cd radare2 && ./sys/install.sh
          cd ..
          
          echo "Verificando funcionamiento del descompilador instalado:"
          r2 -v

      - name: Iniciar servidor de IA local (Qwen)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 10
          ollama pull qwen2.5-coder:7b

      - name: Descargar Opera GX (Windows)
        run: |
          curl -L -o OperaGXSetup.exe "https://net.geo.opera.com/opera_gx/stable/windows"

      - name: Desempaquetar instalador de Windows (SFX)
        run: |
          mkdir -p contenido-extraido
          7z x OperaGXSetup.exe -ocontenido-extraido/ -y || true

      - name: Descompilar funciones críticas de Windows
        run: |
          echo "Iniciando descompilación automatizada..."
          BINARIO=$(find contenido-extraido/ -name "opera.exe" | head -n 1)
          if [ -f "$BINARIO" ]; then
            r2 -qc "aa; pdf @ main" "$BINARIO" > codigo_descompilado_windows.txt || echo "Volcando símbolos..."
            r2 -qc "aa; afl" "$BINARIO" >> codigo_descompilado_windows.txt
          else
            echo "No se encontró opera.exe, listando archivos..."
            find contenido-extraido/ -name "*.dll" | head -n 5 > lista_archivos.txt
          fi

      - name: Pasar código descompilado a Qwen para adaptación
        run: |
          echo "Enviando ingeniería inversa a la IA..."
          CODIGO_CONTEXTO=$(head -n 50 codigo_descompilado_windows.txt | tr -d '"' | tr -d '\n' | tr -d '\r' || echo "Sin contexto")
          PROMPT="Eres un ingeniero experto en sistemas de bajo nivel y portabilidad. Aquí tienes un fragmento de código descompilado extraído del ejecutable de Windows de Opera GX: [$CODIGO_CONTEXTO]. Genera un parche en script de Bash ('patch_comunitario.sh') que configure las banderas de ejecución en Linux e inyecte la librería 'libffmpeg.so' nativa de Linux de forma que reemplace los códecs de Windows para solucionar los streams de Twitch. Devuelve ÚNICAMENTE el código del script bash listo para ejecutarse, sin introducciones ni marcas extras."
          RESPONSE=$(curl -s -X POST http://localhost:11434/api/generate -d "{\"model\": \"qwen2.5-coder:7b\", \"prompt\": \"$PROMPT\", \"stream\": false}" | jq -r '.response')
          echo "$RESPONSE" | sed -n '/```bash/,/```/p' | sed 's/```bash//g' | sed 's/```//g' > contenido-extraido/patch_comunitario.sh
          chmod +x contenido-extraido/patch_comunitario.sh

      - name: Descargar e Inyectar libffmpeg de Ld-Hagen (*-linux-x64.zip)
        run: |
          echo "Buscando patrón *-linux-x64.zip en los servidores de Ld-Hagen..."
          LATEST_FFMPEG_URL=$(curl -s https://api.github.com/repos/Ld-Hagen/fix-opera-linux-ffmpeg-widevine/releases/latest | jq -r '.assets[] | select(.name | match(".*-linux-x64\\.zip$")) | .browser_download_url' | head -n 1)
          NOMBRE_ARCHIVO=$(curl -s https://api.github.com/repos/Ld-Hagen/fix-opera-linux-ffmpeg-widevine/releases/latest | jq -r '.assets[] | select(.name | match(".*-linux-x64\\.zip$")) | .name' | head -n 1)
          if [ -n "$LATEST_FFMPEG_URL" ] && [ "$LATEST_FFMPEG_URL" != "null" ]; then
            wget -O "$NOMBRE_ARCHIVO" "$LATEST_FFMPEG_URL"
            mkdir -p patch-temp
            unzip "$NOMBRE_ARCHIVO" -d patch-temp/
            find patch-temp/ -name "libffmpeg.so" -exec cp {} contenido-extraido/ \;
            echo "¡Librería de la imagen inyectada correctamente!"
          else
            echo "Error en mapeo de zip." && exit 1
          fi

      - name: Actualizar Rama Comunitaria (Exposición de Código)
        run: |
          git config --global user.name "Agente de Porting Automático"
          git config --global user.email "agente@porting.local"
          git checkout -b codigo-extraido || git checkout codigo-extraido
          cp -r contenido-extraido/* .
          cp codigo_descompilado_windows.txt . || true
          git add .
          git commit -m "Primer Lanzamiento: Código descompilado + Adaptación de IA e inyección Multimedia" || echo "Sin cambios"
          git push origin codigo-extraido --force

      - name: Estructurar paquete AppImage
        run: |
          mkdir -p OperaGX.AppDir/usr/bin
          cat << 'EOF' > OperaGX.AppDir/AppRun
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          if ! command -v wine &> /dev/null; then
              echo "Error: Se requiere 'wine' en Linux para correr este port."
              exit 1
          fi
          if [ -f "$HERE/usr/bin/patch_comunitario.sh" ]; then
             source "$HERE/usr/bin/patch_comunitario.sh"
          fi
          wine "$HERE/usr/bin/opera.exe" --no-sandbox --disable-features=GpuSandbox --use-gl=desktop "$@"
          EOF
          chmod +x OperaGX.AppDir/AppRun
          cp -r contenido-extraido/* OperaGX.AppDir/usr/bin/

      - name: Descargar appimagetool oficial
        run: |
          LATEST_APPIMAGE_TOOL=$(curl -s https://api.github.com/repos/AppImage/appimagetool/releases/latest | jq -r '.assets[] | select(.name | endswith("-x86_64.AppImage")) | .browser_download_url' | head -n 1)
          wget -O appimagetool "$LATEST_APPIMAGE_TOOL"
          chmod +x appimagetool

      - name: Compilar archivo final portable para Linux
        run: |
          ./appimagetool OperaGX.AppDir OperaGX-Linux-RE-x86_64.AppImage

      - name: Crear Primer Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: OperaGX-Linux-RE-x86_64.AppImage
          tag_name: v1.0.0-alpha
          name: Opera GX Linux RE Port (Primer Lanzamiento)
          body: |
            ## ¡Primer Lanzamiento Comunitario de Opera GX para Linux!
            
            Este archivo portable ejecutable ha sido generado mediante ingeniería inversa guiada por Inteligencia Artificial de forma automatizada.
            
            ### Qué incluye este release:
            * **Núcleo de Windows:** Extraído de los servidores oficiales estables de Opera.
            * **Twitch & Live Streams Fix:** Integración automatizada del binario `libffmpeg.so` de **Ld-Hagen** filtrado directamente desde el paquete de arquitectura de Linux.
            * **Capa de parches inteligentes:** Script de compatibilidad diseñado por el modelo de IA `qwen2.5-coder` tras analizar las funciones descompiladas.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
